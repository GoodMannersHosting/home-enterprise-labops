router bgp 64513
  bgp router-id 172.21.0.1
  no bgp ebgp-requires-policy
  no bgp default ipv4-unicast
  no bgp network import-check
  bgp log-neighbor-changes
  
  ! Improved stability settings
  ! bgp graceful-restart
  bgp log-neighbor-changes
  
  ! Peer group configuration
  neighbor k8s peer-group
  neighbor k8s remote-as 64514
  
  neighbor k8s timers 5 15
  neighbor k8s timers connect 10
  
  ! Enable BFD for faster failure detection (if supported)
  ! neighbor k8s bfd
  
  ! Soft reconfiguration for easier policy updates
  ! neighbor k8s soft-reconfiguration inbound
  
  ! Limit prefixes to prevent route overflow (adjust as needed)
  ! neighbor k8s maximum-prefix 100 warning-only
  
  ! TTL security for eBGP (since neighbors are directly connected)
  ! neighbor k8s ttl-security hops 1
  
  ! Apply neighbors to peer group
  neighbor 172.21.0.11 peer-group k8s
  neighbor 172.21.0.14 peer-group k8s
  neighbor 172.21.0.15 peer-group k8s
  neighbor 172.21.0.16 peer-group k8s
  neighbor 172.21.0.17 peer-group k8s
  neighbor 172.21.0.18 peer-group k8s
  neighbor 172.21.0.19 peer-group k8s
  neighbor 172.21.0.21 peer-group k8s
  neighbor 172.21.0.22 peer-group k8s
  neighbor 172.21.0.23 peer-group k8s
  neighbor 172.21.0.24 peer-group k8s


  ! eBGP over WireGuard to Tyler/Home router
  neighbor 10.0.1.1 remote-as 64517
  neighbor 10.0.1.1 description Tyler/Home over WireGuard
  neighbor 10.0.1.1 timers 10 30
  neighbor 10.0.1.1 timers connect 10
  neighbor 10.0.1.1 update-source 10.0.1.2

  address-family ipv4 unicast
    neighbor 10.0.1.1 soft-reconfiguration inbound
    neighbor 10.0.1.1 route-map FROM-TYLER in
    neighbor 10.0.1.1 activate

    neighbor k8s next-hop-self
    neighbor k8s activate
  exit-address-family

! route-map FROM-TYLER permit 10
!   match ip address prefix-list K8S-SERVICES
! exit