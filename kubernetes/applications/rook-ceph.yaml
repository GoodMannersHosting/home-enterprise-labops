---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rook-ceph
  namespace: argocd
  labels:
    chartVersion: &chartVersion v1.20.1
    csiChartVersion: &csiChartVersion 1.0.3
spec:
  destination:
    namespace: rook-ceph
    server: https://kubernetes.default.svc
  project: default
  sources:
    - repoURL: &repoUrl https://github.com/GoodMannersHosting/home-enterprise-labops.git
      targetRevision: &tg main
      path: kubernetes/core/rook-ceph
    - repoURL: *repoUrl
      targetRevision: *tg
      ref: values
    - repoURL: &chartURL https://charts.rook.io/release
      chart: &rcc rook-ceph-cluster
      name: *rcc
      targetRevision: *chartVersion
      helm:
        valueFiles:
          - $values/kubernetes/core/rook-ceph/cluster.values.yaml
    - repoURL: *chartURL
      chart: &rc rook-ceph
      name: *rc
      targetRevision: *chartVersion
      helm:
        valueFiles:
          - $values/kubernetes/core/rook-ceph/operator.values.yaml
    - repoURL: https://ceph.github.io/ceph-csi-operator
      chart: &rcccd ceph-csi-drivers
      name: *rcccd
      targetRevision: *csiChartVersion
      helm:
        valueFiles:
          - $values/kubernetes/core/rook-ceph/csi-drivers.values.yaml
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - CreateNamespace=true
