---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: terrakube
  namespace: argocd
  labels:
    chartVersion: &chartVersion 4.7.12
spec:
  destination:
    namespace: terrakube
    server: https://kubernetes.default.svc
  project: default
  sources:
    - repoURL: &repo https://github.com/GoodMannersHosting/home-enterprise-labops.git
      targetRevision: main
      path: kubernetes/services/terrakube
    - repoURL: *repo
      targetRevision: main
      ref: values
    - repoURL: https://charts.terrakube.io
      chart: terrakube
      targetRevision: *chartVersion
      helm:
        valueFiles:
          - $values/kubernetes/services/terrakube/values.yaml
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
