---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: litellm-operator
  namespace: argocd
spec:
  destination:
    namespace: litellm-system
    server: https://kubernetes.default.svc
  project: default
  sources:
    - repoURL: ghcr.io/home-operations/charts
      chart: litellm-operator
      targetRevision: 0.0.26
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - CreateNamespace=true
