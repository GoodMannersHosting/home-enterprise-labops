---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: fission
  namespace: argocd
  labels:
    chartVersion: &chartVersion 1.27.0
spec:
  destination:
    namespace: fission
    server: https://kubernetes.default.svc
  project: default
  sources:
    - repoURL: &repo https://github.com/GoodMannersHosting/home-enterprise-labops.git
      targetRevision: main
      path: kubernetes/services/fission
    - repoURL: *repo
      targetRevision: main
      ref: values
    - repoURL: https://fission.github.io/fission-charts
      chart: fission-all
      targetRevision: *chartVersion
      helm:
        valueFiles:
          - $values/kubernetes/services/fission/values.yaml
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - CreateNamespace=true
