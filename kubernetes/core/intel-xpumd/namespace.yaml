---
apiVersion: v1
kind: Namespace
metadata:
  name: intel-xpu
  labels:
    # The cluster enforces PodSecurity "baseline" by default on unlabeled
    # namespaces (Talos KubeAdmissionControlConfig "PodSecurity"), so the
    # xpumd daemon — which needs the PERFMON capability and hostPath
    # volumes — must opt into privileged, like every other app namespace.
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
