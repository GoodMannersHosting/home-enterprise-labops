apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: gwapi
  namespace: default
  annotations:
    # Split horizon: publicly a CNAME to unifi-home (gwapi-extname.yaml),
    # internally an A record to 172.31.0.10 in UniFi (kube-system/unifi-dns).
    external-dns.kubernetes.io/target: gwapi.cloud.danmanners.com
spec:
  gatewayClassName: istio
  infrastructure:
    annotations:
      lbipam.cilium.io/ips: 172.31.0.10
    parametersRef:
      group: ""
      kind: ConfigMap
      name: gwapi-gw-options
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      hostname: "*.capi-core.homelab.danmanners.com"
      allowedRoutes:
        namespaces:
          from: All
    - name: http-cloud
      protocol: HTTP
      port: 80
      hostname: "*.cloud.danmanners.com"
      allowedRoutes:
        namespaces:
          from: All
    - name: http-goodmanners
      protocol: HTTP
      port: 80
      hostname: "*.goodmanners.services"
      allowedRoutes:
        namespaces:
          from: All
    - name: https
      protocol: HTTPS
      port: 443
      hostname: "*.capi-core.homelab.danmanners.com"
      allowedRoutes:
        namespaces:
          from: All
      tls:
        mode: Terminate
        certificateRefs:
          - name: wildcard
            kind: Secret
            group: ""
    - name: https-cloud
      protocol: HTTPS
      port: 443
      hostname: "*.cloud.danmanners.com"
      allowedRoutes:
        namespaces:
          from: All
      tls:
        mode: Terminate
        certificateRefs:
          - name: wildcard
            kind: Secret
            group: ""
    - name: https-goodmanners
      protocol: HTTPS
      port: 443
      hostname: "*.goodmanners.services"
      allowedRoutes:
        namespaces:
          from: All
      tls:
        mode: Terminate
        certificateRefs:
          - name: wildcard
            kind: Secret
            group: ""

    - name: argocd
      protocol: TLS
      port: 443
      hostname: "argocd.cloud.danmanners.com"
      allowedRoutes:
        namespaces:
          from: All
      tls:
        mode: Passthrough
