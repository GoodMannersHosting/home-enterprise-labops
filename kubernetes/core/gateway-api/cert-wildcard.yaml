apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wildcard
  namespace: default
  annotations:
    cert-manager.io/issuer-kind: ClusterIssuer
    cert-manager.io/issuer-name: letsencrypt-dns01
spec:
  secretName: wildcard
  duration: 1128h # 47 days
  renewBefore: 168h # 7 days
  commonName: "*.cloud.danmanners.com"
  dnsNames:
    # - "*.capi-core.homelab.danmanners.com"
    - "*.cloud.danmanners.com"
    # Do not add "*.goodmanners.services": the pdns webhook only hosts
    # cloud.danmanners.com. The goodmanners.services zone lives in Route53 and
    # does not delegate _acme-challenge, so the DNS-01 challenge fails and takes
    # the whole order (including *.cloud.danmanners.com) down with it.
  issuerRef:
    name: letsencrypt-dns01
    kind: ClusterIssuer
    group: cert-manager.io
  usages:
    - server auth
    - client auth
  secretTemplate:
    annotations:
      reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
      reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
