# Legacy / orphan routes: live in the cluster but not owned by any ArgoCD
# application (their source apps — smort, n8n, the original fission demo, the
# aiml router — were retired or moved to other repos). Adopted here so that
# they are managed by GitOps and, crucially, by external-dns v0.15+ which
# only reads the `external-dns.kubernetes.io/*` (beta) annotations:
#
#   - redirect-https-* : HTTP->HTTPS redirects. MUST stay excluded from
#     external-dns, otherwise they would publish A records for hostnames
#     whose records are owned elsewhere (notably ollama.cloud, whose record
#     is a CNAME to the homelab edge).
#   - fission/hello : owns the functions.cloud TXT ownership records, so it
#     is deliberately NOT excluded via the beta annotation. The legacy alpha
#     exclusion annotation found in the live object is inert for
#     external-dns v0.15+ and is adopted here verbatim.
#
# Removed 2026-11-11: the smort-* routes (backend stack scaled to zero since
# 2026-06) and the aiml/router route (superseded by the llm-router app's
# router-public route).
#
# Delete a route from this file when its backend is removed.
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: redirect-https-capi-core
  namespace: default
  annotations:
    external-dns.kubernetes.io/controller: "false"
spec:
  hostnames:
    - chat.capi-core.homelab.danmanners.com
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: gwapi
      namespace: default
      sectionName: http
  rules:
    - name: redirect-https
      filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
      matches:
        - path:
            type: PathPrefix
            value: /
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: redirect-https-goodmanners
  namespace: default
  annotations:
    external-dns.kubernetes.io/controller: "false"
spec:
  hostnames:
    - chat.goodmanners.services
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: gwapi
      namespace: default
      sectionName: http-goodmanners
  rules:
    - name: redirect-https
      filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
      matches:
        - path:
            type: PathPrefix
            value: /
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hello
  namespace: fission
  annotations:
    # Inert: external-dns v0.15+ only reads the beta (kubernetes.io)
    # annotations. Present in the live object; adopted so ArgoCD sees
    # no drift.
    external-dns.alpha.kubernetes.io/controller: "false"
spec:
  hostnames:
    - functions.cloud.danmanners.com
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: gwapi
      namespace: default
  rules:
    - backendRefs:
        - name: router
          port: 80
      matches:
        - path:
            type: PathPrefix
            value: /hello