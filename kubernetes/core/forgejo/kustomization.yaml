namespace: forgejo
resources:
  - namespace.yaml
  - db-superuser.yaml
  - secret.forgejo.yaml
  - secret.meilisearch.yaml

components:
  - ../../core/kopiur/backup-component

patches:
  # Back up BOTH Forgejo app data (repos, wiki) and Meilisearch index in one policy
  - target:
      kind: SnapshotPolicy
      name: backup-target-pvc
    patch: |
      - op: replace
        path: /metadata/name
        value: forgejo-data
      - op: replace
        path: /spec/sources/0/pvc/name
        value: forgejo-forgejo-app-data
      - op: add
        path: /spec/sources/-
        value:
          pvc:
            name: forgejo-meilisearch-data
          sourcePathStrategy: PvcName
          readOnly: true
  - target:
      kind: SnapshotSchedule
      name: backup-target-schedule
    patch: |
      - op: replace
        path: /metadata/name
        value: forgejo-data-nightly
      - op: replace
        path: /spec/policyRef/name
        value: forgejo-data
