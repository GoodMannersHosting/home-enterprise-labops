# ArgoCD is exposed as a plain HTTPRoute on the terminating https-cloud
# listener, NOT as a TLSRoute SNI-passthrough like before. Reasons:
#  1. Chrome HTTP/2 connection coalescing: Chrome reuses h2 connections to any
#     *.cloud.danmanners.com host (the wildcard cert covers argocd) and sends
#     Host: argocd... over them. A TLSRoute is only matched on SNI, so those
#     requests could never reach argocd and fell through to the catchall-404
#     route ("does not have a service on this gateway"). Firefox/Safari don't
#     coalesce, which made this look Chrome-only.
#  2. Host-based routing works on every connection once TLS terminates at the
#     gateway; argocd-server serves plaintext on 8080 via server.insecure=true
#     in values.yaml (Service port 80 -> 8080).
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd
  namespace: argocd
spec:
  hostnames:
    - argocd.cloud.danmanners.com
  parentRefs:
    - name: gwapi
      namespace: default
      kind: Gateway
      group: gateway.networking.k8s.io
      sectionName: https-cloud
  rules:
    - name: https
      backendRefs:
        - name: argocd-server
          kind: Service
          group: ""
          port: 80
          weight: 1
