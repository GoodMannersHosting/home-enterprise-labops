global:
  domain: &url argocd.cloud.danmanners.com
  hostAliases:
    - ip: "172.31.0.10"
      hostnames:
        - "harbor.cloud.danmanners.com"
        - "ollama.cloud.danmanners.com"
        - "n8n.cloud.danmanners.com"
  # Each component's NetworkPolicy template is gated on
  # `.Values.<component>.networkPolicy.create OR .Values.global.networkPolicy.create`,
  # so a component-level `create: false` can't actually disable it while this default
  # (true) stands. Flip the default off here and re-enable per component below for
  # everything except repoServer/controller — see the comment on `repoServer.networkPolicy`
  # for why those two need it off.
  networkPolicy:
    create: false

crds:
  install: false

redis-ha:
  enabled: true

applicationSet:
  replicas: 2

configs:
  cm:
    admin.enabled: true
    url: &fullUrl https://argocd.cloud.danmanners.com
    oidc.config: |
      name: Authentik
      issuer: https://auth.goodmanners.services/application/o/argo-cd/
      clientID: argocd
      clientSecret: $oidc.argocd.clientSecret
      allowedAudiences:
        - argocd
      enablePKCEAuthentication: true
      requestedScopes: ["openid", "profile", "email", "groups"]
      userNameKey: email
      overrideClaimMapping: true
      logoutURL: https://auth.goodmanners.services/application/o/argo-cd/logout/
  rbac:
    policy.default: role:readonly
    policy.csv: |
      # Argo Actions
      p, role:org-admin, applications, create, */*, allow
      p, role:org-admin, applications, update, */*, allow
      p, role:org-admin, applications, delete, */*, allow
      p, role:org-admin, applications, sync, */*, allow
      p, role:org-admin, applications, override, */*, allow
      p, role:org-admin, applications, action/*, */*, allow
      p, role:org-admin, applicationsets, get, */*, allow
      p, role:org-admin, applicationsets, create, */*, allow
      p, role:org-admin, applicationsets, update, */*, allow
      p, role:org-admin, applicationsets, delete, */*, allow
      p, role:org-admin, certificates, create, *, allow
      p, role:org-admin, certificates, update, *, allow
      p, role:org-admin, certificates, delete, *, allow
      p, role:org-admin, clusters, create, *, allow
      p, role:org-admin, clusters, update, *, allow
      p, role:org-admin, clusters, delete, *, allow
      p, role:org-admin, repositories, create, *, allow
      p, role:org-admin, repositories, update, *, allow
      p, role:org-admin, repositories, delete, *, allow
      p, role:org-admin, projects, create, *, allow
      p, role:org-admin, projects, update, *, allow
      p, role:org-admin, projects, delete, *, allow
      p, role:org-admin, accounts, update, *, allow
      p, role:org-admin, gpgkeys, create, *, allow
      p, role:org-admin, gpgkeys, delete, *, allow
      p, role:org-admin, exec, create, */*, allow
      g, argocd-admins, role:org-admin
      # Gaming
      p, role:gamers, applications, get, */*, allow
      p, role:gamers, applications, sync, */*, allow
      p, role:gamers, clusters, get, *, allow
      p, role:gamers, logs, get, default/windrose-9a, allow
      p, role:gamers, applications, action/apps/StatefulSet/restart, default/windrose-9a, allow
      p, role:gamers, applications, action/apps/Deployment/restart, default/windrose-9a, allow
      g, gamers, role:gamers

repoServer:
  replicas: 2
  # Node Selector to ensure the repo server runs on only AMD64 nodes
  nodeSelector:
    kubernetes.io/arch: amd64
  # The default NetworkPolicy only allows ingress to the metrics/health port from
  # `namespaceSelector: {}`, which (per k8s NetworkPolicy semantics) matches pod-
  # originated traffic only — it never matches kubelet's host-network-origin
  # liveness/readiness probes. That silently breaks probes and crash-loops the
  # repo-server. Same issue affects `controller` below. Disabling NetworkPolicy
  # creation for just these two components is low-risk: the existing rule was
  # already permissive to "any pod in any namespace", so this doesn't meaningfully
  # change the security posture.
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  readinessProbe:
    timeoutSeconds: 5
  livenessProbe:
    timeoutSeconds: 5

controller:
  replicas: 1
  # See the note on `repoServer` above and `global.networkPolicy.create` — left
  # disabled (inherits the global default) for the same reason.

server:
  replicas: 2
  networkPolicy:
    create: true
  service:
    annotations:
      gatus.home-operations.com/enabled: "true"
      gatus.home-operations.com/endpoint: |-
        name: ArgoCD
        client:
          insecure: true
        conditions:
          - "[STATUS] == 200"
        url: https://argocd-server.argocd.svc.cluster.local/
        method: HEAD
  config:
    application.instanceLabelKey: argocd.argoproj.io/instance
    url: *fullUrl
    # Why in the HECK is this here? See below!
    # https://argo-cd.readthedocs.io/en/stable/faq/#why-is-my-application-still-outofsync-immediately-after-a-successful-sync
    # https://github.com/argoproj/argo-cd/blob/v3.0.0/docs/operator-manual/argocd-cm.yaml#L278
    # Thanks a ton to @onedr0p, @toboshii, and @xUnholy for the help in figuring this out!
  certificate:
    enabled: true
    secretName: argocd-tls-cert
    duration: 1128h # 47 days
    renewBefore: 168h # 7 days
    commonName: *url
    dnsNames:
      - *url
    issuer:
      kind: ClusterIssuer
      name: letsencrypt-dns01
      group: cert-manager.io
  ingress:
    enabled: false

dex:
  networkPolicy:
    create: true

notifications:
  networkPolicy:
    create: true
