apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: db
  namespace: database
spec:
  instances: 3
  imageName: ghcr.io/cloudnative-pg/postgresql:17.10-standard-bookworm
  primaryUpdateStrategy: unsupervised
  storage:
    size: 64Gi
    storageClass: ceph-block-retain
  superuserSecret:
    name: database-superuser
  enableSuperuserAccess: true
  managed:
    roles:
      - name: litellm
        ensure: present
        login: true
        # Secret lives in this namespace, produced by
        # ../../services/llm-router/db/externalsecret.yaml (sourced from
        # OpenBao) and reflected into aiml for the proxy.
        passwordSecret:
          name: litellm-db-credentials
  postgresql:
    parameters:
      max_connections: "600"
      shared_buffers: 512MB
      wal_level: replica
      min_wal_size: 1500MB
      max_wal_size: 4GB
  resources:
    requests:
      memory: "2Gi"
      cpu: "200m"
    limits:
      memory: "4Gi"
      cpu: "2"
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: kubernetes.io/arch
                operator: In
                values:
                  - "amd64"
