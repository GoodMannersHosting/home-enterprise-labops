cluster:
  name: "helo"
destinations:
  loki:
    type: loki
    url: https://loki.cloud.witl.xyz/loki/api/v1/push
    auth:
      type: oauth2
      oauth2:
        tokenURL: https://auth.cloud.witl.xyz/application/o/token/
        clientIdKey: client_id
        clientSecretKey: client_secret
        scopes:
          - openid
          - tenant
          - loki:write
        endpointParams:
          grant_type: client_credentials
    secret:
      create: false
      name: observability-m2m
  mimir:
    type: prometheus
    url: https://mimir.cloud.witl.xyz/api/v1/push
    auth:
      type: oauth2
      oauth2:
        tokenURL: https://auth.cloud.witl.xyz/application/o/token/
        clientIdKey: client_id
        clientSecretKey: client_secret
        scopes:
          - openid
          - tenant
          - mimir:write
        endpointParams:
          grant_type: client_credentials
    secret:
      create: false
      name: observability-m2m
  tempo:
    type: otlp
    protocol: http
    url: https://tempo.cloud.witl.xyz/v1/traces
    auth:
      type: oauth2
      oauth2:
        tokenURL: https://auth.cloud.witl.xyz/application/o/token/
        clientIdKey: client_id
        clientSecretKey: client_secret
        scopes:
          - openid
          - tenant
          - tempo:write
        endpointParams:
          grant_type: client_credentials
    secret:
      create: false
      name: observability-m2m
    metrics: { enabled: false }
    logs: { enabled: false }
    traces: { enabled: true }
#
# Features
#
clusterMetrics:
  enabled: true
  collector: alloy-metrics
hostMetrics:
  enabled: true
  collector: alloy-metrics
clusterEvents:
  enabled: true
  collector: alloy-singleton
nodeLogs:
  enabled: false
podLogsViaKubernetesApi:
  enabled: true
  collector: alloy-logs
applicationObservability:
  enabled: false
autoInstrumentation:
  enabled: false
annotationAutodiscovery:
  enabled: true
  collector: alloy-metrics
# Alloy scrapes ServiceMonitor/PodMonitor/Probe CRDs directly and remote-writes
# to Mimir, replacing the kube-prometheus-stack Prometheus server this cluster
# used to run (see kubernetes/core/monitoring/values.yaml).
prometheusOperatorObjects:
  enabled: true
  collector: alloy-metrics
profiling:
  enabled: false
integrations:
  collector: alloy-metrics
  cert-manager:
    instances:
      - name: cert-manager
        namespace: cert-manager
        labelSelectors:
          app.kubernetes.io/name: cert-manager
  alloy:
    instances:
      - name: alloy
        labelSelectors:
          app.kubernetes.io/name:
            - alloy-metrics
            - alloy-singleton
            - alloy-logs
selfReporting:
  enabled: false
collectors:
  alloy-metrics:
    presets: [clustered, statefulset]
    alloy:
      storagePath: /var/lib/alloy
      mounts:
        extra:
          - name: alloy-wal
            mountPath: /var/lib/alloy
    controller:
      enableStatefulSetAutoDeletePVC: true
      volumeClaimTemplates:
        - metadata:
            name: alloy-wal
          spec:
            accessModes: ["ReadWriteOnce"]
            storageClassName: "ceph-block"
            resources:
              requests:
                storage: 5Gi
  # alloy-singleton also syncs PrometheusRule/AlertmanagerConfig CRDs to the
  # remote Mimir ruler + alertmanager (mimir.rules.kubernetes /
  # mimir.alerts.kubernetes), replacing the local Alertmanager this cluster
  # used to run. See ../k8s-monitoring/rbac-mimir-rules.yaml for the RBAC this
  # needs, and alertmanager-global-config.secret.yaml for the routing config
  # (currently a placeholder "null" receiver - wire a real one in before
  # relying on this for paging).
  alloy-singleton:
    presets: [singleton]
    extraConfig: |-
      local.file "observability_m2m_client_id" {
        filename = "/var/run/secrets/observability-m2m/client_id"
      }
      local.file "alertmanager_global" {
        filename = "/etc/alloy/alertmanager-global/config"
      }
      mimir.rules.kubernetes "mimir" {
        address       = "https://mimir.cloud.witl.xyz"
        sync_interval = "2m"
        oauth2 {
          token_url           = "https://auth.cloud.witl.xyz/application/o/token/"
          client_id           = string.trim_space(local.file.observability_m2m_client_id.content)
          client_secret_file  = "/var/run/secrets/observability-m2m/client_secret"
          scopes              = ["openid", "tenant", "mimir:write", "mimir:read"]
          endpoint_params     = { "grant_type" = "client_credentials" }
        }
      }
      mimir.alerts.kubernetes "mimir" {
        address       = "https://mimir.cloud.witl.xyz"
        global_config = local.file.alertmanager_global.content
        sync_interval = "2m"
        oauth2 {
          token_url           = "https://auth.cloud.witl.xyz/application/o/token/"
          client_id           = string.trim_space(local.file.observability_m2m_client_id.content)
          client_secret_file  = "/var/run/secrets/observability-m2m/client_secret"
          scopes              = ["openid", "tenant", "mimir:write", "mimir:read"]
          endpoint_params     = { "grant_type" = "client_credentials" }
        }
      }
    alloy:
      stabilityLevel: experimental
      mounts:
        extra:
          - name: observability-m2m
            mountPath: /var/run/secrets/observability-m2m
            readOnly: true
          - name: alertmanager-global
            mountPath: /etc/alloy/alertmanager-global
            readOnly: true
    controller:
      volumes:
        extra:
          - name: observability-m2m
            secret:
              secretName: observability-m2m
          - name: alertmanager-global
            secret:
              secretName: alertmanager-global-config
  alloy-logs:
    presets: [clustered, daemonset]
    alloy:
      storagePath: /var/lib/alloy
      mounts:
        extra:
          - name: alloy-log-positions
            mountPath: /var/lib/alloy
    controller:
      volumes:
        extra:
          - name: alloy-log-positions
            hostPath:
              path: /var/alloy-log-storage
              type: DirectoryOrCreate
telemetryServices:
  kube-state-metrics:
    deploy: true
  node-exporter:
    deploy: true
