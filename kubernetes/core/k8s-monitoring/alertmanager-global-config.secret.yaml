---
# global_config for alloy-singleton's mimir.alerts.kubernetes (see values.yaml).
# Placeholder: routes exist for critical/warning severities plus the standard
# Watchdog silence, but every route points at the "null" receiver, so nothing
# pages anyone yet. Wire a real receiver (Pushover/Slack/etc.) into the
# `receivers` list and point the matching route(s) at it before relying on
# this for alert delivery. No secret material lives here today, so this is a
# plain Secret rather than an ExternalSecret/OpenBao entry - switch it to one
# once a receiver needs real credentials (token, webhook URL, etc.).
apiVersion: v1
kind: Secret
metadata:
  name: alertmanager-global-config
  namespace: monitoring
stringData:
  config: |
    global:
      resolve_timeout: 5m
    route:
      group_by:
        - alertname
        - cluster
        - namespace
      group_interval: 10m
      group_wait: 5m
      receiver: "null"
      repeat_interval: 12h
      routes:
        - receiver: "null"
          matchers:
            - alertname = "Watchdog"
        - receiver: "null"
          matchers:
            - severity = "critical"
        - receiver: "null"
          matchers:
            - severity = "warning"
    receivers:
      - name: "null"
