---
# RBAC for mimir.rules.kubernetes and mimir.alerts.kubernetes (see
# values.yaml, collectors.alloy-singleton): matches Grafana's documented RBAC
# for these components (namespaces + prometheusrules/alertmanagerconfigs
# only - https://grafana.com/docs/alloy/latest/reference/components/mimir/).
# No cluster-wide Secret access: neither component resolves secretKeyRef
# itself, and the current alertmanager-global-config uses a credential-free
# null receiver, so there's nothing for it to read yet.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: k8s-monitoring-mimir-rules
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["monitoring.coreos.com"]
    resources: ["prometheusrules"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["monitoring.coreos.com"]
    resources: ["alertmanagerconfigs"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: k8s-monitoring-mimir-rules
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: k8s-monitoring-mimir-rules
subjects:
  - kind: ServiceAccount
    name: k8s-monitoring-alloy-singleton
    namespace: monitoring
