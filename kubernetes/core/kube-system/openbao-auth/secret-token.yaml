# Long-lived token for the token-reviewer ServiceAccount. OpenBao
# (keeper.goodmanners.services) uses this as token_reviewer_jwt to call
# this cluster's TokenReview API when validating ESO's Kubernetes auth
# logins. See ~/src/hcloud-security-cluster/bao/setup-kubernetes-auth.sh.
apiVersion: v1
kind: Secret
metadata:
  name: token-reviewer-token
  annotations:
    kubernetes.io/service-account.name: token-reviewer
type: kubernetes.io/service-account-token
