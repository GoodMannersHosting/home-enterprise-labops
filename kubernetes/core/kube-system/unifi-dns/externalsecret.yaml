---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: unifi-dns-secret
spec:
  secretStoreRef:
    name: openbao-labops
    kind: ClusterSecretStore
  target:
    name: unifi-dns-secret
    creationPolicy: Owner
  refreshInterval: 1h
  data:
    - secretKey: api-key
      remoteRef:
        key: dan/unifi-dns
        property: api-key
