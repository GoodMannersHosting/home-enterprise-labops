---
# PowerDNS API key for the pdns provider. OpenBao source: secret/dan/dns/pdns
# (keeper.goodmanners.services). The security-cluster PowerDNS
# (pdns.goodmanners.services) is authoritative for cloud.danmanners.com and
# _acme-challenge.goodmanners.services.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pdns-api-key
  namespace: kube-system
spec:
  secretStoreRef:
    name: openbao-labops
    kind: ClusterSecretStore
  target:
    name: pdns-api-key
    creationPolicy: Owner
  refreshInterval: 1h
  data:
    - secretKey: api-key
      remoteRef:
        key: dan/dns/pdns
        property: api-key
