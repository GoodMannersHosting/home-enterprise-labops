---
fullnameOverride: coredns
replicaCount: 2
k8sAppLabelOverride: kube-dns
serviceAccount:
  create: true
service:
  name: kube-dns
  clusterIP: 10.96.0.10
servers:
- zones:
  - zone: .
    scheme: dns://
    use_tcp: true
  port: 53
  plugins:
  - name: errors
  - name: health
    configBlock: |-
      lameduck 5s
  - name: ready
  - name: log
    configBlock: |-
      class error
  - name: prometheus
    parameters: 0.0.0.0:9153
  - name: kubernetes
    parameters: cluster.local in-addr.arpa ip6.arpa
    configBlock: |-
      pods insecure
      fallthrough in-addr.arpa ip6.arpa
  # Answer the internal gwapi LB IP for public hostnames instead of
  # forwarding to upstream DNS. The terrakube API/registry fetch DEX JWKs
  # from terrakube-api.cloud.danmanners.com; if that name ever resolves to
  # the public WAN IP (Unifi/PowerDNS flap), the fetch hairpins through
  # Unifi's NAT loopback and intermittently times out, breaking JWT
  # validation (2026-10-22 incident).
  - name: hosts
    configBlock: |-
      172.31.0.10 terrakube-api.cloud.danmanners.com
      172.31.0.10 terrakube-ui.cloud.danmanners.com
      172.31.0.10 terrakube-reg.cloud.danmanners.com
      fallthrough
  - name: forward
    parameters: . /etc/resolv.conf
  - name: cache
    parameters: 30
  - name: loop
  - name: reload
  - name: loadbalance
affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
      - matchExpressions:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
tolerations:
- key: CriticalAddonsOnly
  operator: Exists
- key: node-role.kubernetes.io/control-plane
  operator: Exists
  effect: NoSchedule
topologySpreadConstraints:
- maxSkew: 1
  topologyKey: kubernetes.io/hostname
  whenUnsatisfiable: ScheduleAnyway
  labelSelector:
    matchLabels:
      app.kubernetes.io/instance: coredns
