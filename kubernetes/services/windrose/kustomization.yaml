namespace: gaming
resources:
- secret.windrose.yaml

components:
  - ../../core/kopiur/backup-component

patches:
  - target:
      kind: SnapshotPolicy
      name: backup-target-pvc
    patch: |
      - op: replace
        path: /metadata/name
        value: windrose-data
      - op: replace
        path: /spec/sources/0/pvc/name
        value: windrose
  - target:
      kind: SnapshotSchedule
      name: backup-target-schedule
    patch: |
      - op: replace
        path: /metadata/name
        value: windrose-data-nightly
      - op: replace
        path: /spec/policyRef/name
        value: windrose-data

configMapGenerator:
  - name: windrose-configmap
    files:
      - config.json=./config.json
      - ServerDescription.json=./ServerDescription.json

generatorOptions:
  disableNameSuffixHash: true