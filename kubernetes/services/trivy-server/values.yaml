---
# In-cluster Trivy server for Meticulous pipeline agents.
# Agents set TRIVY_REMOTE=http://trivy-server:8080 (trivy-scan workflow >= 1.3.0)
# and query this shared, auto-updating vulnerability DB instead of pulling the
# ~1 GB DB over OCI from GitHub on every scan step.
#
# Image: ghcr.io/aquasecurity/trivy:0.69.3 (version-pinned; matches the
# trivy-scan workflow default). `trivy server` auto-updates the DB when it is
# older than 24h (default since v0.60); no cron needed.
#
# No auth on purpose: ClusterIP-only, reachable from inside the cluster only
# (same posture as Harbor's own trivy scanner). Enable --token later if this
# ever needs to be exposed beyond the cluster.
defaultPodOptions:
  automountServiceAccountToken: false
  enableServiceLinks: true
  restartPolicy: Always

controllers:
  main:
    enabled: true
    type: deployment
    replicas: 1
    revisionHistoryLimit: 1
    containers:
      core:
        ports:
          - name: api
            containerPort: 8080
            protocol: TCP
        image:
          repository: ghcr.io/aquasecurity/trivy
          tag: "0.69.3"
          pullPolicy: "IfNotPresent"
        args:
          - server
          - --listen
          - 0.0.0.0:8080
          - --cache-dir
          - /root/.cache/trivy
        probes:
          liveness: &probes
            enabled: true
            custom: true
            spec:
              tcpSocket:
                port: 8080
              initialDelaySeconds: 30
              periodSeconds: 15
              timeoutSeconds: 3
              failureThreshold: 4
          readiness: *probes
        securityContext:
          allowPrivilegeEscalation: false
          capabilities: { drop: ["ALL"] }
        resources:
          requests:
            cpu: 100m
            memory: 512Mi
          limits:
            cpu: 2000m
            memory: 4Gi

service:
  api:
    enabled: true
    controller: main
    primary: true
    type: ClusterIP
    ports:
      api:
        enabled: true
        port: 8080
        targetPort: 8080
        protocol: TCP

persistence:
  cache:
    enabled: true
    type: persistentVolumeClaim
    storageClass: ceph-block-retain
    accessMode: ReadWriteOnce
    size: 5Gi
    retain: true
    globalMounts:
      - path: /root/.cache/trivy
        readOnly: false
