# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
---
# Intel ARC B70 PRO with intel/llm-scaler-vllm, Gemma 4 12B-it in FP8 quantization.
# intel/llm-scaler-vllm is Intel's optimized vLLM fork for Arc/Battlemage GPUs.
# Gemma 4 12B FP8 weights ~12GB; max-model-len capped at 90K per Intel reference commands.
#
# google/gemma-4-12B-it is NOT the same architecture as the other Gemma 4 models:
# its model_type is `gemma4_unified` (Gemma4UnifiedForConditionalGeneration), the
# encoder-free variant, which HF added in transformers 5.10. The 0.26.0-b2 image
# already implements Gemma4UnifiedForConditionalGeneration in its vLLM fork, but it
# ships transformers 5.8.0, whose config registry only knows `gemma4`. AutoConfig
# therefore rejects the checkpoint before vLLM ever sees it.
# See https://github.com/intel/llm-scaler/issues/705
#
# Fix: the init container below overlays transformers 5.10.2 onto PYTHONPATH.
# --no-deps is required so the image's pinned huggingface-hub/tokenizers/numpy
# (which torch + the vLLM fork are built against) are left untouched.
# Do NOT replace this with `--hf-overrides '{"model_type":"gemma4"}'`: vLLM applies
# hf_overrides *after* AutoConfig.from_pretrained(), so it cannot fix a model_type
# the installed transformers cannot resolve in the first place.
defaultPodOptions:
  automountServiceAccountToken: false
  enableServiceLinks: false
  restartPolicy: Always
  dnsPolicy: ClusterFirst
  nodeSelector:
    kubernetes.io/hostname: intellectual
    intel.feature.node.kubernetes.io/gpu: "true"
  securityContext:
    fsGroup: 1000
    fsGroupChangePolicy: OnRootMismatch

controllers:
  main:
    enabled: true
    type: deployment
    replicas: 1
    revisionHistoryLimit: 2
    initContainers:
      transformers-overlay:
        # Same image as `core` so pip targets the identical Python 3.12 and the
        # layer is already present on the node (no extra pull).
        image:
          repository: intel/llm-scaler-vllm
          tag: 0.26.0-b2
          pullPolicy: IfNotPresent
        command:
          - /bin/sh
          - -c
          - pip install --quiet --no-deps --target /transformers-overlay "transformers==5.10.2"
        securityContext: {}
        resources:
          requests:
            cpu: "200m"
            memory: "512Mi"
          limits:
            cpu: "1000m"
            memory: "2Gi"
    containers:
      core:
        ports:
          - name: http
            containerPort: &port 8080
            protocol: TCP
        image:
          repository: intel/llm-scaler-vllm
          tag: 0.26.0-b2
          pullPolicy: Always
        args:
          - google/gemma-4-12B-it
          - --host
          - 0.0.0.0
          - --port
          - "8080"
          - --dtype
          - float16
          - --mamba-ssm-cache-dtype
          - float16
          - --quantization
          - fp8
          - --gpu-memory-util
          - "0.90"
          - --max-num-batched-tokens
          - "8192"
          - --max-model-len
          - "90000"
          - --block-size
          - "64"
          - --tensor-parallel-size
          - "1"
          - --enforce-eager
          - --served-model-name
          - intel-gemma-4-12b-fp8
          - --enable-auto-tool-choice
          - --tool-call-parser
          - gemma4
          - --enable-prefix-caching
          - --trust-remote-code

        env:
          - name: VLLM_ALLOW_LONG_MAX_MODEL_LEN
            value: "1"
          - name: VLLM_WORKER_MULTIPROC_METHOD
            value: spawn
          - name: HF_HOME
            value: /cache/huggingface
          # Must precede the venv so transformers 5.10.2 shadows the bundled 5.8.0.
          - name: PYTHONPATH
            value: /transformers-overlay
          # Without this the ~12GB weight pull runs anonymously; vLLM logs
          # "You are sending unauthenticated requests to the HF Hub" and the
          # download is rate-limited.
          - name: HF_TOKEN
            valueFrom:
              secretKeyRef:
                name: hf-secret
                key: token
          # Bearer auth for the OpenAI-compatible API. llm-router already sends
          # this same secret (see llm-router/models/model-intel.yaml); without it
          # the LoadBalancer on 172.31.0.35 is unauthenticated.
          - name: VLLM_API_KEY
            valueFrom:
              secretKeyRef:
                name: intel-llm-api-key
                key: api-key


        securityContext: {}
        resources:
          requests:
            cpu: "4000m"
            memory: "8Gi"
            gpu.intel.com/xe: "1"
          limits:
            cpu: "8000m"
            memory: "16Gi"
            gpu.intel.com/xe: "1"

service:
  core:
    enabled: true
    controller: main
    primary: true
    type: ClusterIP
    ports:
      http:
        enabled: true
        port: *port
        targetPort: http
        protocol: TCP
  public:
    enabled: true
    controller: main
    primary: false
    type: LoadBalancer
    externalTrafficPolicy: Cluster
    annotations:
      lbipam.cilium.io/ips: "172.31.0.35"
      external-dns.alpha.kubernetes.io/hostname: intel-llm.cloud.danmanners.com
      external-dns.alpha.kubernetes.io/ttl: "300"
    ports:
      http:
        enabled: true
        port: *port
        targetPort: http
        protocol: TCP

persistence:
  cache:
    enabled: true
    type: persistentVolumeClaim
    storageClass: ceph-block-retain
    accessMode: ReadWriteOnce
    size: 100Gi
    retain: true
    advancedMounts:
      main:
        core:
          - path: /cache/huggingface
            readOnly: false
  shm:
    enabled: true
    type: emptyDir
    medium: Memory
    sizeLimit: 16Gi
    advancedMounts:
      main:
        core:
          - path: /dev/shm
            readOnly: false
  transformers-overlay:
    enabled: true
    type: emptyDir
    advancedMounts:
      main:
        transformers-overlay:
          - path: /transformers-overlay
            readOnly: false
        core:
          - path: /transformers-overlay
            readOnly: true

