# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
---
# Intel ARC B70 PRO with vLLM SYCL, Gemma 4 12B Unified model in FP8 quantization.
# 16GB VRAM: 12B * 1 byte (FP8) = ~12GB weights + KV cache fits.
# Gemma 4 12B supports 256K context, multimodal (text/image/audio), and is encoder-free.
defaultPodOptions:
  automountServiceAccountToken: false
  enableServiceLinks: false
  restartPolicy: Always
  dnsPolicy: ClusterFirst
  nodeSelector:
    kubernetes.io/hostname: intellectual
    intel.feature.node.kubernetes.io/gpu: "true"
  securityContext:
    fsGroup: 1000
    fsGroupChangePolicy: OnRootMismatch

controllers:
  main:
    enabled: true
    type: deployment
    replicas: 1
    revisionHistoryLimit: 2
    containers:
      core:
        ports:
          - name: http
            containerPort: &port 8080
            protocol: TCP
        image:
          repository: vllm/vllm-openai
          tag: v0.29.0-x86_64
          pullPolicy: Always
        args:
          - --model
          - google/gemma-4-12B-it
          - --quantization
          - fp8
          - --gpu-memory-utilization
          - "0.95"
          - --max-num-batched-tokens
          - "2048"
          - --max-model-len
          - "131072"
          - --enable-chunked-prefill
          - --disable-log-requests
        env:
          - name: VLLM_HOST_IP
            value: "0.0.0.0"
          - name: VLLM_PORT
            value: "8080"
          - name: HF_HOME
            value: /cache/huggingface
        securityContext: {}
        resources:
          requests:
            cpu: "4000m"
            memory: "8Gi"
            gpu.intel.com/xe: "1"
          limits:
            cpu: "8000m"
            memory: "16Gi"
            gpu.intel.com/xe: "1"

service:
  core:
    enabled: true
    controller: main
    primary: true
    type: ClusterIP
    ports:
      http:
        enabled: true
        port: *port
        targetPort: http
        protocol: TCP
  public:
    enabled: true
    controller: main
    primary: false
    type: LoadBalancer
    externalTrafficPolicy: Cluster
    annotations:
      lbipam.cilium.io/ips: "172.31.0.35"
      external-dns.alpha.kubernetes.io/hostname: intel-llm.cloud.danmanners.com
      external-dns.alpha.kubernetes.io/ttl: "300"
    ports:
      http:
        enabled: true
        port: *port
        targetPort: http
        protocol: TCP

persistence:
  cache:
    enabled: true
    type: persistentVolumeClaim
    storageClass: ceph-block-retain
    accessMode: ReadWriteOnce
    size: 100Gi
    retain: true
    advancedMounts:
      main:
        core:
          - path: /root/.cache/huggingface
            readOnly: false
        download-model:
          - path: /root/.cache/huggingface
            readOnly: false
  shm:
    enabled: true
    type: emptyDir
    medium: Memory
    sizeLimit: 16Gi
    advancedMounts:
      main:
        core:
          - path: /dev/shm
            readOnly: false
