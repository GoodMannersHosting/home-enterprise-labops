# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
---
# Intel ARC B70 PRO with intel/llm-scaler-vllm, Gemma 4 12B-it in FP8 quantization.
# intel/llm-scaler-vllm is Intel's optimized vLLM fork for Arc/Battlemage GPUs.
# Gemma 4 12B FP8 weights ~12GB; max-model-len capped at 90K per Intel reference commands.
# HF_TOKEN is required: google/gemma-4-12B-it is a gated model.
defaultPodOptions:
  automountServiceAccountToken: false
  enableServiceLinks: false
  restartPolicy: Always
  dnsPolicy: ClusterFirst
  nodeSelector:
    kubernetes.io/hostname: intellectual
    intel.feature.node.kubernetes.io/gpu: "true"
  securityContext:
    fsGroup: 1000
    fsGroupChangePolicy: OnRootMismatch

controllers:
  main:
    enabled: true
    type: deployment
    replicas: 1
    revisionHistoryLimit: 2
    containers:
      core:
        ports:
          - name: http
            containerPort: &port 8080
            protocol: TCP
        image:
          repository: intel/llm-scaler-vllm
          tag: 0.26.0-b2
          pullPolicy: Always
        args:
          - google/gemma-4-12B-it
          - --host
          - 0.0.0.0
          - --port
          - "8080"
          - --dtype
          - float16
          - --mamba-ssm-cache-dtype
          - float16
          - --quantization
          - fp8
          - --gpu-memory-util
          - "0.90"
          - --max-num-batched-tokens
          - "8192"
          - --max-model-len
          - "90000"
          - --block-size
          - "64"
          - --tensor-parallel-size
          - "1"
          - --enforce-eager
          - --served-model-name
          - intel-gemma-4-12b-fp8
          - --enable-auto-tool-choice
          - --tool-call-parser
          - pythonic
          - --enable-prefix-caching
          - --trust-remote-code

        env:
          - name: VLLM_ALLOW_LONG_MAX_MODEL_LEN
            value: "1"
          - name: VLLM_WORKER_MULTIPROC_METHOD
            value: spawn
          - name: HF_HOME
            value: /cache/huggingface
          - name: HF_TOKEN
            valueFrom:
              secretKeyRef:
                name: hf-token
                key: token
        securityContext: {}
        resources:
          requests:
            cpu: "4000m"
            memory: "8Gi"
            gpu.intel.com/xe: "1"
          limits:
            cpu: "8000m"
            memory: "16Gi"
            gpu.intel.com/xe: "1"

service:
  core:
    enabled: true
    controller: main
    primary: true
    type: ClusterIP
    ports:
      http:
        enabled: true
        port: *port
        targetPort: http
        protocol: TCP
  public:
    enabled: true
    controller: main
    primary: false
    type: LoadBalancer
    externalTrafficPolicy: Cluster
    annotations:
      lbipam.cilium.io/ips: "172.31.0.35"
      external-dns.alpha.kubernetes.io/hostname: intel-llm.cloud.danmanners.com
      external-dns.alpha.kubernetes.io/ttl: "300"
    ports:
      http:
        enabled: true
        port: *port
        targetPort: http
        protocol: TCP

persistence:
  cache:
    enabled: true
    type: persistentVolumeClaim
    storageClass: ceph-block-retain
    accessMode: ReadWriteOnce
    size: 100Gi
    retain: true
    advancedMounts:
      main:
        core:
          - path: /cache/huggingface
            readOnly: false
  shm:
    enabled: true
    type: emptyDir
    medium: Memory
    sizeLimit: 16Gi
    advancedMounts:
      main:
        core:
          - path: /dev/shm
            readOnly: false
