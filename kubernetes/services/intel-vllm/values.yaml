# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
---
# llama-server on Intel Arc B70 (intellectual). OpenAI-compatible API; not vLLM despite the service name.
# Model: HauhauCS Gemma4-26B-A4B-QAT-Uncensored (Balanced), Q4_K_M + BF16 mmproj + MTP speculative draft.
# Backend: Vulkan (ghcr.io/ggml-org/llama.cpp:server-vulkan). GPU offload confirmed working via gpu.intel.com/xe.
# SYCL (server-intel) untested for this model/build; see README before switching.
defaultPodOptions:
  automountServiceAccountToken: false
  enableServiceLinks: false
  restartPolicy: Always
  dnsPolicy: ClusterFirst
  nodeSelector:
    kubernetes.io/hostname: intellectual
    intel.feature.node.kubernetes.io/gpu: "true"
  securityContext:
    fsGroup: 1000
    fsGroupChangePolicy: OnRootMismatch

controllers:
  main:
    enabled: true
    type: deployment
    replicas: 1
    revisionHistoryLimit: 2
    initContainers:
      download-model:
        image:
          repository: curlimages/curl
          tag: "8.11.1"
          pullPolicy: IfNotPresent
        command:
          - /bin/sh
          - -c
          - |
            set -eu
            DEST=/root/.cache/huggingface/hauhaucs-gemma4
            mkdir -p "$DEST"

            fetch() {
              url="$1"
              out="$DEST/$2"
              if [ -s "$out" ]; then
                echo "already present: $out"
                return 0
              fi
              echo "downloading: $out"
              curl -fL --retry 5 --retry-delay 5 -o "$out.part" "$url"
              mv "$out.part" "$out"
            }

            fetch "https://huggingface.co/HauhauCS/Gemma4-26B-A4B-QAT-Uncensored-HauhauCS-Balanced-MTP/resolve/main/Gemma4-26B-A4B-QAT-Uncensored-HauhauCS-Balanced-Q4_K_M.gguf" "Gemma4-26B-A4B-QAT-Uncensored-HauhauCS-Balanced-Q4_K_M.gguf"
            fetch "https://huggingface.co/HauhauCS/Gemma4-26B-A4B-QAT-Uncensored-HauhauCS-Balanced-MTP/resolve/main/mmproj-Gemma4-26B-A4B-QAT-Uncensored-HauhauCS-Balanced-BF16.gguf" "mmproj-Gemma4-26B-A4B-QAT-Uncensored-HauhauCS-Balanced-BF16.gguf"
            fetch "https://huggingface.co/HauhauCS/Gemma4-26B-A4B-QAT-Uncensored-HauhauCS-Balanced-MTP/resolve/main/mtp-gemma-4-26B-A4B-it.gguf" "mtp-gemma-4-26B-A4B-it.gguf"
        resources:
          requests:
            cpu: "250m"
            memory: "256Mi"
          limits:
            cpu: "1000m"
            memory: "512Mi"
    containers:
      core:
        ports:
          - name: http
            containerPort: &port 8080
            protocol: TCP
        image:
          repository: ghcr.io/ggml-org/llama.cpp
          tag: server-vulkan
          pullPolicy: Always
        # Image ENTRYPOINT is /app/llama-server; do not override command with sh.
        args:
          - --model
          - /root/.cache/huggingface/hauhaucs-gemma4/Gemma4-26B-A4B-QAT-Uncensored-HauhauCS-Balanced-Q4_K_M.gguf
          - --mmproj
          - /root/.cache/huggingface/hauhaucs-gemma4/mmproj-Gemma4-26B-A4B-QAT-Uncensored-HauhauCS-Balanced-BF16.gguf
          - --no-mmproj-offload
          - --spec-draft-model
          - /root/.cache/huggingface/hauhaucs-gemma4/mtp-gemma-4-26B-A4B-it.gguf
          - --spec-type
          - draft-mtp
          # Performance Settings
          - --gpu-layers
          - "999"
          - --fit
          - "on"
          - --fit-ctx
          - "32768"
          - --ctx-size
          - "204800"
          - --ctx-checkpoints
          - "16"
          - --flash-attn
          - "on"
          - --cache-type-k
          - q5_0
          - --cache-type-v
          - q5_0
          - --cpu-strict
          - "1"
          # Single-user chat.
          - --parallel
          - "1"
          - --cache-ram
          - "0"
          - --reasoning
          - "on"
          - --reasoning-budget
          - "-1"
          - --batch-size
          - "4096"
          - --ubatch-size
          - "1024"
          - --threads
          - "16"
          - --cache-prompt
          - --load-mode
          - mmap
          # Tunings — per HauhauCS Balanced model card recommendations
          - --temperature
          - "0.6"
          - --top-k
          - "64"
          - --top-p
          - "0.9"
          - --min-p
          - "0.05"
          - --repeat-penalty
          - "1.1"
          - --jinja
        env:
          # Bind via env only — image sets LLAMA_ARG_HOST; duplicating --host triggers a startup warning.
          - name: LLAMA_ARG_HOST
            value: "0.0.0.0"
          - name: LLAMA_ARG_PORT
            value: "8080"
          - name: GGML_VK_MMVQ_SHMEM_STAGING
            value: "1"
        securityContext: {}
        resources:
          requests:
            cpu: "10000m"
            memory: "24Gi"
            gpu.intel.com/xe: "1"
          limits:
            cpu: "10000m"
            memory: "48Gi"
            gpu.intel.com/xe: "1"

service:
  core:
    enabled: true
    controller: main
    primary: true
    type: ClusterIP
    ports:
      http:
        enabled: true
        port: *port
        targetPort: http
        protocol: TCP
  public:
    enabled: true
    controller: main
    primary: false
    type: LoadBalancer
    externalTrafficPolicy: Cluster
    annotations:
      lbipam.cilium.io/ips: "172.31.0.35"
      external-dns.alpha.kubernetes.io/hostname: intel-llm.cloud.danmanners.com
      external-dns.alpha.kubernetes.io/ttl: "300"
    ports:
      http:
        enabled: true
        port: *port
        targetPort: http
        protocol: TCP

persistence:
  cache:
    enabled: true
    type: persistentVolumeClaim
    storageClass: ceph-block-retain
    accessMode: ReadWriteOnce
    size: 100Gi
    retain: true
    advancedMounts:
      main:
        core:
          - path: /root/.cache/huggingface
            readOnly: false
        download-model:
          - path: /root/.cache/huggingface
            readOnly: false
  shm:
    enabled: true
    type: emptyDir
    medium: Memory
    sizeLimit: 16Gi
    advancedMounts:
      main:
        core:
          - path: /dev/shm
            readOnly: false
