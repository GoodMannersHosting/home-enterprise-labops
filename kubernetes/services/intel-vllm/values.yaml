# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
---
# Intel ARC B70 PRO (32GB) with intel/llm-scaler-vllm,
# cyankiwi/Qwen3-Coder-30B-A3B-Instruct-AWQ-4bit.
# intel/llm-scaler-vllm is Intel's optimized vLLM fork for Arc/Battlemage GPUs.
#
# Qwen3-Coder-30B-A3B is a 30B MoE (~3B active). BF16 weights are ~60GB and do
# not fit a 32GB card (online FP8 ~30GB leaves no KV headroom), so the AWQ
# 4-bit checkpoint (~17GB weights) is used. vLLM auto-detects the quantization
# from the checkpoint (compressed-tensors WNA16); no --quantization flag.
#
# --max-model-len 32768 is the model's native context (256K only via YaRN).
# At 96 KiB KV/token the 0.95 memory budget leaves ~124K tokens of KV, so the
# 32K cap still allows ~3 concurrent full-length requests.
defaultPodOptions:
  automountServiceAccountToken: false
  enableServiceLinks: false
  restartPolicy: Always
  dnsPolicy: ClusterFirst
  nodeSelector:
    kubernetes.io/hostname: intellectual
    intel.feature.node.kubernetes.io/gpu: "true"
  securityContext:
    fsGroup: 1000
    fsGroupChangePolicy: OnRootMismatch

controllers:
  main:
    enabled: true
    type: deployment
    replicas: 1
    revisionHistoryLimit: 2
    containers:
      core:
        ports:
          - name: http
            containerPort: &port 8080
            protocol: TCP
        image:
          repository: intel/llm-scaler-vllm
          tag: 0.26.0-b2
          pullPolicy: Always
        args:
          - cyankiwi/Qwen3-Coder-30B-A3B-Instruct-AWQ-4bit
          - --host
          - 0.0.0.0
          - --port
          - "8080"
          - --dtype
          - float16
          - --gpu-memory-util
          - "0.95"
          - --max-num-batched-tokens
          - "8192"
          - --max-model-len
          - "32768"
          - --max-num-seqs
          - "8"
          - --block-size
          - "64"
          - --tensor-parallel-size
          - "1"
          - --enforce-eager
          - --served-model-name
          - intel-qwen3-coder
          - --enable-auto-tool-choice
          - --tool-call-parser
          - qwen3_coder
          - --enable-prefix-caching
          - --trust-remote-code
        env:
          - name: VLLM_WORKER_MULTIPROC_METHOD
            value: spawn
          - name: HF_HOME
            value: /cache/huggingface
          # Without this the ~17GB weight pull runs anonymously; vLLM logs
          # "You are sending unauthenticated requests to the HF Hub" and the
          # download is rate-limited.
          - name: HF_TOKEN
            valueFrom:
              secretKeyRef:
                name: hf-secret
                key: token
          # Bearer auth for the OpenAI-compatible API. llm-router already sends
          # this same secret (see llm-router/models/model-intel.yaml); without it
          # the LoadBalancer on 172.31.0.35 is unauthenticated.
          - name: VLLM_API_KEY
            valueFrom:
              secretKeyRef:
                name: intel-llm-api-key
                key: api-key

        securityContext: {}
        resources:
          requests:
            cpu: "4000m"
            memory: "8Gi"
            gpu.intel.com/xe: "1"
          limits:
            cpu: "8000m"
            memory: "16Gi"
            gpu.intel.com/xe: "1"

service:
  core:
    enabled: true
    controller: main
    primary: true
    type: ClusterIP
    ports:
      http:
        enabled: true
        port: *port
        targetPort: http
        protocol: TCP
  public:
    enabled: true
    controller: main
    primary: false
    type: LoadBalancer
    externalTrafficPolicy: Cluster
    annotations:
      lbipam.cilium.io/ips: "172.31.0.35"
      external-dns.alpha.kubernetes.io/hostname: intel-llm.cloud.danmanners.com
      external-dns.alpha.kubernetes.io/ttl: "300"
    ports:
      http:
        enabled: true
        port: *port
        targetPort: http
        protocol: TCP

persistence:
  cache:
    enabled: true
    type: persistentVolumeClaim
    storageClass: ceph-block-retain
    accessMode: ReadWriteOnce
    size: 100Gi
    retain: true
    advancedMounts:
      main:
        core:
          - path: /cache/huggingface
            readOnly: false
  shm:
    enabled: true
    type: emptyDir
    medium: Memory
    sizeLimit: 16Gi
    advancedMounts:
      main:
        core:
          - path: /dev/shm
            readOnly: false


