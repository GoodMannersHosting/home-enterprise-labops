# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
---
# Intel ARC B70 PRO (32GB) with intel/llm-scaler-vllm,
# Qwen/Qwen3.6-35B-A3B (Qwen3_5MoeForConditionalGeneration).
# intel/llm-scaler-vllm is Intel's optimized vLLM fork for Arc/Battlemage GPUs.
#
# Qwen3.6-35B-A3B is a 35B MoE (~3B active) with hybrid Gated DeltaNet + full
# attention (one full-attention layer per 4). The BF16 checkpoint is ~72GB, so
# a single 32GB card must run 4-bit: online symmetric INT4
# (--quantization sym_int4, llm-scaler's documented path for this model; the
# ~36GB FP8 checkpoint does not fit either). Weights are quantized from the
# cached BF16 checkpoint at every startup.
#
# KV is cheap on the hybrid stack (20 KiB/token: 10 full-attention layers,
# 2 KV heads, head_dim 256), so --max-model-len 131072 still allows several
# concurrent full-length sequences; the native 262144 also fits if needed.
#
# MTP speculative decoding (--speculative-config qwen3_5_mtp, 4 draft tokens)
# is verified by llm-scaler on this exact model.
#
# Thinking mode is ON by default in this model's chat template; clients that
# need fast, non-thinking responses (e.g. VSCode autocomplete via Continue)
# pass chat_template_kwargs: {enable_thinking: false}.
defaultPodOptions:
  automountServiceAccountToken: false
  enableServiceLinks: false
  restartPolicy: Always
  dnsPolicy: ClusterFirst
  nodeSelector:
    kubernetes.io/hostname: intellectual
    intel.feature.node.kubernetes.io/gpu: "true"
  securityContext:
    fsGroup: 1000
    fsGroupChangePolicy: OnRootMismatch

controllers:
  main:
    enabled: true
    type: deployment
    replicas: 1
    revisionHistoryLimit: 2
    containers:
      core:
        ports:
          - name: http
            containerPort: &port 8080
            protocol: TCP
        image:
          repository: intel/llm-scaler-vllm
          tag: 0.26.0-b2
          pullPolicy: Always
        args:
          - Qwen/Qwen3.6-35B-A3B
          - --host
          - 0.0.0.0
          - --port
          - "8080"
          - --dtype
          - float16
          # Online 4-bit: the only variant of this model that fits one 32GB
          # card. BF16 weights (~72GB) are cached on the PVC and quantized at
          # load time (llm-scaler §2.2 / §3.2).
          - --quantization
          - sym_int4
          # DeltaNet (linear-attention) state in FP16 (llm-scaler reference).
          - --mamba-ssm-cache-dtype
          - float16
          # Skip the vision tower (~2GB) — text-only workloads.
          - --language-model-only
          - --gpu-memory-util
          - "0.95"
          - --max-num-batched-tokens
          - "8192"
          - --max-model-len
          - "131072"
          - --max-num-seqs
          - "8"
          - --block-size
          - "64"
          - --tensor-parallel-size
          - "1"
          - --enforce-eager
          - --served-model-name
          - intel-qwen36
          - --enable-auto-tool-choice
          - --tool-call-parser
          - qwen3_coder
          - --enable-prefix-caching
          - --trust-remote-code
          # 1-layer MTP head, verified on Qwen3.6-35B-A3B by llm-scaler §3.6.
          - --speculative-config
          - '{"method":"qwen3_5_mtp","num_speculative_tokens":4}'
        env:
          - name: VLLM_WORKER_MULTIPROC_METHOD
            value: spawn
          - name: HF_HOME
            value: /cache/huggingface
          # llm-scaler §3.2: the dynamic INT4 kernels live in this shared
          # library. The docs point at dist-packages; this image is a venv.
          - name: VLLM_QUANTIZE_Q40_LIB
            value: /opt/venv/lib/python3.12/site-packages/vllm_int4_for_multi_arc.so
          # Without this the ~72GB weight pull runs anonymously; vLLM logs
          # "You are sending unauthenticated requests to the HF Hub" and the
          # download is rate-limited.
          - name: HF_TOKEN
            valueFrom:
              secretKeyRef:
                name: hf-secret
                key: token
          # Bearer auth for the OpenAI-compatible API. llm-router already sends
          # this same secret (see llm-router/models/model-intel.yaml); without it
          # the LoadBalancer on 172.31.0.35 is unauthenticated.
          - name: VLLM_API_KEY
            valueFrom:
              secretKeyRef:
                name: intel-llm-api-key
                key: api-key

        securityContext: {}
        resources:
          requests:
            cpu: "4000m"
            memory: "8Gi"
            gpu.intel.com/xe: "1"
          limits:
            cpu: "8000m"
            memory: "16Gi"
            gpu.intel.com/xe: "1"

service:
  core:
    enabled: true
    controller: main
    primary: true
    type: ClusterIP
    ports:
      http:
        enabled: true
        port: *port
        targetPort: http
        protocol: TCP
  public:
    enabled: true
    controller: main
    primary: false
    type: LoadBalancer
    externalTrafficPolicy: Cluster
    annotations:
      lbipam.cilium.io/ips: "172.31.0.35"
      external-dns.kubernetes.io/hostname: intel-llm.cloud.danmanners.com
      external-dns.kubernetes.io/ttl: "300"
    ports:
      http:
        enabled: true
        port: *port
        targetPort: http
        protocol: TCP

persistence:
  cache:
    enabled: true
    type: persistentVolumeClaim
    storageClass: ceph-block-retain
    accessMode: ReadWriteOnce
    size: 200Gi
    retain: true
    advancedMounts:
      main:
        core:
          - path: /cache/huggingface
            readOnly: false
  shm:
    enabled: true
    type: emptyDir
    medium: Memory
    sizeLimit: 16Gi
    advancedMounts:
      main:
        core:
          - path: /dev/shm
            readOnly: false


