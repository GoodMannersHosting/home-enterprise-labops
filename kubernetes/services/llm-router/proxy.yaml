---
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMProxy
metadata:
  name: router
  namespace: aiml
spec:
  # No modelSelector: adopts every LiteLLMModel in aiml.
  applyMode: api # models push to the live admin API (DB-backed); needed for
  # the webui and for LiteLLMVirtualKey/LiteLLMTeam to mint keys through it.
  apiAccess:
    masterKeyRef:
      name: litellm-master-key
      key: master-key
  generalSettings:
    background_health_checks: true
    health_check_interval: 300
  litellmSettings:
    drop_params: true
    request_timeout: 900 # intel-llama can outlast the default on long prefills
    cache: true
    cache_params:
      type: redis
      namespace: "litellm.cache"
      ttl: 3600 # seconds; exact-match response cache
      # No host/port here: REDIS_CLUSTER_NODES below makes litellm build a
      # cluster-aware client for every Redis use (see env), and that takes
      # precedence over host/port regardless.
    # Share virtual-key (token) auth verification results across replicas/workers
    # instead of each one warming its own in-memory copy against Postgres.
    enable_redis_auth_cache: true
  callbacks:
    callbacks:
      - prometheus
  resources:
    requests:
      cpu: 100m
      memory: 1Gi
    limits:
      memory: 2Gi
  # Prisma's first database migration can take longer than the operator's
  # default 60-second liveness window. Keep readiness strict while allowing
  # enough time for one-time schema initialization.
  livenessProbe:
    httpGet:
      path: /health/liveliness
      port: 4000
    initialDelaySeconds: 180
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
  env:
    - name: LITELLM_MASTER_KEY
      valueFrom:
        secretKeyRef:
          name: litellm-master-key
          key: master-key
    - name: LITELLM_DB_USER
      valueFrom:
        secretKeyRef:
          name: litellm-db-credentials # reflected into aiml from database/litellm-db-credentials
          key: username
    - name: LITELLM_DB_PASSWORD
      valueFrom:
        secretKeyRef:
          name: litellm-db-credentials
          key: password
    - name: DATABASE_URL
      value: "postgresql://$(LITELLM_DB_USER):$(LITELLM_DB_PASSWORD)@db-rw.database.svc.cluster.local:5432/litellm"
    # Enabling DATABASE_URL turns on the admin UI at /ui automatically; these
    # give it its own login instead of falling back to admin/<master key>.
    - name: UI_USERNAME
      valueFrom:
        secretKeyRef:
          name: litellm-ui-credentials
          key: username
    - name: UI_PASSWORD
      valueFrom:
        secretKeyRef:
          name: litellm-ui-credentials
          key: password
    # SSO via Authentik (Generic OIDC provider)
    - name: GENERIC_CLIENT_ID
      valueFrom:
        secretKeyRef:
          name: litellm-sso-credentials
          key: client-id
    - name: GENERIC_CLIENT_SECRET
      valueFrom:
        secretKeyRef:
          name: litellm-sso-credentials
          key: client-secret
    - name: GENERIC_AUTHORIZATION_ENDPOINT
      value: https://auth.goodmanners.services/application/o/authorize/
    - name: GENERIC_TOKEN_ENDPOINT
      value: https://auth.goodmanners.services/application/o/token/
    - name: GENERIC_USERINFO_ENDPOINT
      value: https://auth.goodmanners.services/application/o/userinfo/
    - name: PROXY_BASE_URL
      value: https://llm.cloud.danmanners.com
    - name: PROXY_LOGOUT_URL
      value: https://auth.goodmanners.services/application/o/llm-router/logout/
    - name: UI_DEFAULT_LOGIN
      value: sso
    # OIDC group-to-role mapping
    # valkeycluster.yaml (llm-router, valkey-operator) backs every litellm
    # Redis use: OIDC PKCE storage, the response cache, and the virtual-key
    # auth cache above. It's Cluster-mode-only (valkey-operator has no
    # standalone mode), so litellm needs REDIS_CLUSTER_NODES rather than
    # plain REDIS_HOST/PORT to get a cluster-aware client everywhere
    # (litellm/_redis.py: get_redis_client() branches on REDIS_CLUSTER_NODES
    # for *all* redis usage, not just caching). One seed node is enough —
    # the client discovers the rest of the topology via CLUSTER SLOTS. The
    # headless Service name is "valkey-<clustername>", per valkey-operator's
    # own convention, not "<clustername>-valkey".
    - name: REDIS_CLUSTER_NODES
      value: '[{"host": "valkey-llm-router.aiml.svc.cluster.local", "port": "6379"}]'
    - name: OIDC_GROUP_CLAIM
      value: groups
    - name: OIDC_GROUP_TO_ROLE_MAP
      value: '{"llm-admin":"proxy_admin","llm-user":"internal_user_viewer"}'
  route:
    hostnames:
      - llm.cloud.danmanners.com
    parentRefs:
      - kind: Gateway
        group: gateway.networking.k8s.io
        name: gwapi
        namespace: default
        sectionName: https-cloud
