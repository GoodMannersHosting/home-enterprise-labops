---
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMProxy
metadata:
  name: router
  namespace: aiml
spec:
  # No modelSelector: adopts every LiteLLMModel in aiml.
  generalSettings:
    background_health_checks: true
    health_check_interval: 300
  litellmSettings:
    drop_params: true
    request_timeout: 900 # intel-llama can outlast the default on long prefills
  callbacks:
    callbacks:
      - prometheus
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 1Gi
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
  env:
    - name: LITELLM_MASTER_KEY
      valueFrom:
        secretKeyRef:
          name: litellm-master-key
          key: master-key
  # No route: see httproute.yaml / README (DNS: the CNAME workaround).
