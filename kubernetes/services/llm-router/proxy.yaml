---
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMProxy
metadata:
  name: router
  namespace: aiml
spec:
  # No modelSelector: adopts every LiteLLMModel in aiml.
  applyMode: api # models push to the live admin API (DB-backed); needed for
  # the webui and for LiteLLMVirtualKey/LiteLLMTeam to mint keys through it.
  apiAccess:
    masterKeyRef:
      name: litellm-master-key
      key: master-key
  generalSettings:
    background_health_checks: true
    health_check_interval: 300
  litellmSettings:
    drop_params: true
    request_timeout: 900 # intel-llama can outlast the default on long prefills
  callbacks:
    callbacks:
      - prometheus
  resources:
    requests:
      cpu: 100m
      memory: 1Gi
    limits:
      memory: 2Gi
  # Prisma's first database migration can take longer than the operator's
  # default 60-second liveness window. Keep readiness strict while allowing
  # enough time for one-time schema initialization.
  livenessProbe:
    httpGet:
      path: /health/liveliness
      port: 4000
    initialDelaySeconds: 180
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
  env:
    - name: LITELLM_MASTER_KEY
      valueFrom:
        secretKeyRef:
          name: litellm-master-key
          key: master-key
    - name: LITELLM_DB_USER
      valueFrom:
        secretKeyRef:
          name: litellm-db-credentials # reflected into aiml from database/litellm-db-credentials
          key: username
    - name: LITELLM_DB_PASSWORD
      valueFrom:
        secretKeyRef:
          name: litellm-db-credentials
          key: password
    - name: DATABASE_URL
      value: "postgresql://$(LITELLM_DB_USER):$(LITELLM_DB_PASSWORD)@db-rw.database.svc.cluster.local:5432/litellm"
    # Enabling DATABASE_URL turns on the admin UI at /ui automatically; these
    # give it its own login instead of falling back to admin/<master key>.
    - name: UI_USERNAME
      valueFrom:
        secretKeyRef:
          name: litellm-ui-credentials
          key: username
    - name: UI_PASSWORD
      valueFrom:
        secretKeyRef:
          name: litellm-ui-credentials
          key: password
    # SSO via Authentik (Generic OIDC provider)
    - name: GENERIC_CLIENT_ID
      valueFrom:
        secretKeyRef:
          name: litellm-sso-credentials
          key: client-id
    - name: GENERIC_CLIENT_SECRET
      valueFrom:
        secretKeyRef:
          name: litellm-sso-credentials
          key: client-secret
    - name: GENERIC_AUTHORIZATION_ENDPOINT
      value: https://auth.goodmanners.services/application/o/authorize/
    - name: GENERIC_TOKEN_ENDPOINT
      value: https://auth.goodmanners.services/application/o/token/
    - name: GENERIC_USERINFO_ENDPOINT
      value: https://auth.goodmanners.services/application/o/userinfo/
    - name: PROXY_BASE_URL
      value: https://llm.cloud.danmanners.com
    - name: PROXY_LOGOUT_URL
      value: https://auth.goodmanners.services/application/o/llm-router/logout/
    - name: GENERIC_CLIENT_USE_PKCE
      value: "true"
    - name: UI_DEFAULT_LOGIN
      value: sso
  route:
    hostnames:
      - llm.cloud.danmanners.com
    parentRefs:
      - kind: Gateway
        group: gateway.networking.k8s.io
        name: gwapi
        namespace: default
        sectionName: https-cloud
