---
# Dedicated login for the litellm admin UI (https://llm.cloud.danmanners.com/ui),
# separate from LITELLM_MASTER_KEY. Sourced from OpenBao like the master key
# (see README's Secret source: OpenBao section) rather than generated
# in-cluster through the scoped eso-labops-litellm policy.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: litellm-ui-credentials
  namespace: aiml
spec:
  secretStoreRef:
    name: openbao-labops
    kind: ClusterSecretStore
  target:
    name: litellm-ui-credentials
    creationPolicy: Owner
  refreshInterval: 1h
  data:
    - secretKey: password
      remoteRef:
        key: dan/aiml/litellm-ui-credentials
        property: password
