---
# Materializes litellm's database role credentials from OpenBao. Lives in
# `database` (not `aiml`) because CNPG's managed-role
# passwordSecret must sit alongside the Cluster it belongs to; the
# reflection-* annotations mirror a copy into `aiml` for the proxy itself.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: litellm-db-credentials
spec:
  secretStoreRef:
    name: openbao-labops
    kind: ClusterSecretStore
  refreshInterval: 1h
  target:
    name: litellm-db-credentials
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth # required by CNPG's managed-role passwordSecret
      metadata:
        labels:
          cnpg.io/reload: "true" # tells CNPG to pick up password changes
        annotations:
          reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
          reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: aiml
          reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
  data:
    - secretKey: username
      remoteRef:
        key: dan/aiml/litellm-db-credentials
        property: username
    - secretKey: password
      remoteRef:
        key: dan/aiml/litellm-db-credentials
        property: password
