---
# Valkey Cluster managed by valkey-operator (valkey-io/valkey-operator).
# 3 shards × 2 replicas (leader + follower) for HA across 3 availability zones.
apiVersion: valkey.io/v1alpha1
kind: ValkeyCluster
metadata:
  name: llm-router
  namespace: aiml
spec:
  shards: 3
  replicas: 1
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 2Gi
  valkeyImage:
    repository: docker.io/valkey/valkey
    tag: "9-alpine"
  storageClassName: "default"
  volumeSize: 10Gi
