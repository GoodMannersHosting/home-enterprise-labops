---
# OIDC client credentials for the llm-router admin UI SSO.
# The Authentik OAuth application should be configured with:
#   Redirect URI: https://llm.cloud.danmanners.com/sso/callback
#   Logout URI:   https://llm.cloud.danmanners.com
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: litellm-sso-credentials
  namespace: aiml
spec:
  secretStoreRef:
    name: openbao-labops
    kind: ClusterSecretStore
  target:
    name: litellm-sso-credentials
    creationPolicy: Owner
  refreshInterval: 1h
  data:
    - secretKey: client-id
      remoteRef:
        key: dan/aiml/litellm-sso-credentials
        property: client-id
    - secretKey: client-secret
      remoteRef:
        key: dan/aiml/litellm-sso-credentials
        property: client-secret
