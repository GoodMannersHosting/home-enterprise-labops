apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# No blanket `namespace:` here (unlike most other services): the nested `db`
# kustomization needs its own `namespace: database`, and kustomize's namespace
# transformer overrides a child's setting unconditionally if set at this
# level. Every resource below sets its own metadata.namespace: aiml instead.

resources:
  - externalsecret.yaml
  - externalsecret.bonsai.yaml
  - db # database-namespace: CNPG Database CR + reflected role credentials
  - ui-credentials.yaml
  - valkey.yaml
  - sso-credentials.yaml
  - proxy.yaml
  - model-nvidia.yaml
  - model-intel.yaml
  - model-bonsai.yaml
  - team.yaml
  - virtualkeys.yaml
  - servicemonitor.yaml
