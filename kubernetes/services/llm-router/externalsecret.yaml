---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: litellm-master-key
spec:
  secretStoreRef:
    name: openbao-litellm
    kind: SecretStore
  target:
    name: litellm-master-key
    creationPolicy: Owner
  refreshInterval: 1h
  data:
    - secretKey: master-key
      remoteRef:
        key: labops/aiml/litellm-master-key
        property: master-key
