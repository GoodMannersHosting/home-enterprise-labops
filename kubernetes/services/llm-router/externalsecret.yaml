---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: litellm-master-key
  namespace: aiml
spec:
  secretStoreRef:
    name: openbao-labops
    kind: ClusterSecretStore
  target:
    name: litellm-master-key
    creationPolicy: Owner
  refreshInterval: 1h
  data:
    - secretKey: master-key
      remoteRef:
        key: dan/aiml/litellm-master-key
        property: master-key
