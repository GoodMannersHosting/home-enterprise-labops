---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: openai-api-key
  namespace: aiml
spec:
  secretStoreRef:
    name: openbao-labops
    kind: ClusterSecretStore
  target:
    name: openai-api-key
    creationPolicy: Owner
  refreshInterval: 1h
  data:
    - secretKey: api-key
      remoteRef:
        key: dan/aiml/litellm-openai-key
        property: api-key
