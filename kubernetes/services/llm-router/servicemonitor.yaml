---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: llm-router
  namespace: aiml
  labels:
    # kube-prometheus-stack's Prometheus only watches ServiceMonitors carrying
    # this label by default (release = the Helm release name, which for an
    # unnamed Argo CD source defaults to the Application name: "monitoring").
    # Verify with:
    #   kubectl get prometheus -n monitoring -o jsonpath='{.items[0].spec.serviceMonitorSelector}'
    release: monitoring
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: litellm
      app.kubernetes.io/instance: router
      app.kubernetes.io/managed-by: litellm-operator
  namespaceSelector:
    matchNames:
      - aiml
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
      # litellm requires auth on every route except /health/*; scraping
      # /metrics with no credentials 401s (confirmed in the live pod logs).
      authorization:
        credentials:
          name: litellm-master-key
          key: master-key
