---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: llm-router
  namespace: aiml
  labels:
    release: monitoring # required by the monitoring Prometheus's serviceMonitorSelector
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: litellm
      app.kubernetes.io/instance: router
      app.kubernetes.io/managed-by: litellm-operator
  namespaceSelector:
    matchNames:
      - aiml
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
      authorization: # litellm requires auth on every route except /health/*
        credentials:
          name: litellm-master-key
          key: master-key
