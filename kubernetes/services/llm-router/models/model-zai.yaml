---
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: zai-wildcard
  namespace: aiml
spec:
  proxyRef: router
  modelName: "zai/*"
  params:
    model: "zai/*"
    apiBase: https://api.z.ai/api/paas/v4
    apiKeyRef:
      name: zai-api-key
      key: api-key
  info:
    mode: chat
    extra:
      health_check_model: zai/glm-5.3-flash