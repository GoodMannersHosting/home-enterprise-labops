---
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  # Renamed 2026-10-24 (was intel-llama) to free that name for the new
  # llama.cpp backend in model-llama.yaml. Params are unchanged — vLLM still
  # serves the model as intel-qwen36.
  name: intel-qwen36
  namespace: aiml
spec:
  modelName: intel-qwen36
  params:
    model: intel-qwen36
    apiBase: http://intel-vllm-core.aiml.svc.cluster.local:8080/v1
    apiKeyRef:
      name: intel-llm-api-key
      key: api-key
    additional:
      input_cost_per_token: 0.00000249
      output_cost_per_token: 0.00000249
      thinking_always_on: false
  info:
    maxInputTokens: 131072
    supportsFunctionCalling: true
