---
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: intel-llama
  namespace: aiml
spec:
  modelName: intel-llama
  params:
    model: openai/llama
    apiBase: http://intel-llama-core.aiml.svc.cluster.local:8080/v1
    apiKeyRef:
      name: intel-llm-api-key
      key: api-key
    additional:
      # Same per-token cost as the previous Intel backend (same hardware
      # tier); no published cost data exists for Flint yet — revisit when
      # there is.
      input_cost_per_token: 0.00000249
      output_cost_per_token: 0.00000249
      thinking_always_on: false
  info:
    mode: chat
    maxInputTokens: 229376
    maxOutputTokens: 32768
    supportsFunctionCalling: true
    supportsVision: false
    extra:
      model_family: Nanbeige4.3-33B
      serving_engine: llama.cpp
      quantization: Q4_K_L
      served_context_tokens: 262144