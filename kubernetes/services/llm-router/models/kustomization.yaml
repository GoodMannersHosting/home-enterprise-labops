apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# No blanket `namespace:` here (unlike most other services): the nested `db`
# kustomization needs its own `namespace: database`, and kustomize's namespace
# transformer overrides a child's setting unconditionally if set at this
# level. Every resource below sets its own metadata.namespace: aiml instead.

resources:
  - model-decision.yaml
  - model-embed-text.yaml
  - model-foundation.yaml
  - model-gptoss.yaml
  - model-intel.yaml
  - model-intel-vl.yaml
  - model-llama.yaml
  - model-media-analysis.yaml
  - model-nvidia.yaml
  - model-rerank-docs.yaml
  - model-transcribe.yaml 
  - model-zai.yaml
