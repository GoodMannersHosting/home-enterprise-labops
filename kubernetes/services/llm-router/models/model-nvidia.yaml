---
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: nvidia-llama
  namespace: aiml
spec:
  modelName: nvidia-llama
  params:
    model: hosted_vllm/inkling-2-mini
    apiBase: http://nvidia-vllm-core.aiml.svc.cluster.local:8080/v1
    apiKeyRef:
      name: nvidia-llm-api-key
      key: api-key
    additional:
      input_cost_per_token: 0.0000023860
      output_cost_per_token: 0.0000028322
  info:
    mode: chat
    # 215,040 total context tokens.
    # Reserve 32,768 for model output.
    maxInputTokens: 182272
    maxOutputTokens: 32768
    supportsFunctionCalling: true
    supportsVision: false
    extra:
      model_family: Inkling-2-Mini
      model_provider: thinkingmachines
      serving_engine: vllm
      quantization: NVFP4_MXFP8
      served_context_tokens: 215040
      parameter_count: 26.4B
      active_parameters: 3.4B
      architecture: looped_moe
      kv_cache_dtype: fp8
      reasoning: true
      supports_tool_choice: true
      deployment_gpu: RTX_5090
