---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: nvidia-vllm
  namespace: aiml
  labels:
    release: monitoring # required by the monitoring Prometheus's serviceMonitorSelector
spec:
  selector:
    matchLabels:
      app.kubernetes.io/service: nvidia-vllm-core
  namespaceSelector:
    matchNames:
      - aiml
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
