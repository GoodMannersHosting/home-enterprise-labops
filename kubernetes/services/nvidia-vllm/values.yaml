# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
---
defaultPodOptions:
  automountServiceAccountToken: false
  enableServiceLinks: false
  restartPolicy: Always
  dnsPolicy: ClusterFirst
  runtimeClassName: nvidia
  securityContext:
    fsGroup: 1000
    fsGroupChangePolicy: OnRootMismatch

controllers:
  main:
    enabled: true
    type: deployment
    replicas: 1
    revisionHistoryLimit: 2
    containers:
      core:
        ports:
          - name: http
            containerPort: &port 8080
            protocol: TCP
        image:
          repository: vllm/vllm-openai
          tag: inkling-2-mini
          digest: sha256:c2dc759f5984f69c1e2418c6af7c26eb756f5ed2a8934c768ae1253645d1449e
        args:
          - --model
          - thinkingmachines/Inkling-2-Mini

          - --host
          - "0.0.0.0"
          - --port
          - "8080"

          - --served-model-name
          - inkling-2-mini

          # Single RTX 5090
          - --tensor-parallel-size
          - "1"

          # Maximize cache capacity on a dedicated GPU.
          - --gpu-memory-utilization
          - "1.0"

          # Longest published working RTX 5090 config.
          - --max-model-len
          - "1"

          # FP8 is essential for large context.
          - --kv-cache-dtype
          - fp8

          # Prioritize one large agent session.
          - --max-num-seqs
          - "1"

          # Chunk long prompt processing.
          - --enable-chunked-prefill
          - --max-num-batched-tokens
          - "8192"

          # Reuse matching prompt prefixes.
          - --enable-prefix-caching

          # Inkling-specific parsers.
          - --reasoning-parser
          - inkling
          - --enable-auto-tool-choice
          - --tool-call-parser
          - inkling
          #-  --speculative-config '{"method":"dspark","num_speculative_tokens":7,"draft_sample_method":"probabilistic"}'
        env:
          - name: VLLM_API_KEY
            valueFrom:
              secretKeyRef:
                name: nvidia-llm-api-key
                key: api-key
          - name: HF_HOME
            value: /cache/huggingface
          # hf-xet (bundled with huggingface_hub) already gives fast, chunked
          # concurrent downloads by default; this just raises its concurrency
          # ceiling. HF_TOKEN avoids anonymous-request rate limiting (and is
          # required for gated models), same as intel-vllm.
          - name: HF_XET_HIGH_PERFORMANCE
            value: "1"
          - name: HF_TOKEN
            valueFrom:
              secretKeyRef:
                name: hf-secret
                key: token
        securityContext:
          allowPrivilegeEscalation: false
        probes:
          startup:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /health
                port: http
              initialDelaySeconds: 60
              periodSeconds: 30
              failureThreshold: 60
          readiness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /health
                port: http
              initialDelaySeconds: 10
              periodSeconds: 15
          liveness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /health
                port: http
              initialDelaySeconds: 30
              periodSeconds: 30
        resources:
          limits:
            nvidia.com/gpu: "1"
            memory: 64Gi
          requests:
            nvidia.com/gpu: "1"
            memory: 48Gi
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File

service:
  core:
    enabled: true
    controller: main
    primary: true
    type: ClusterIP
    ports:
      http:
        enabled: true
        port: *port
        targetPort: http
        protocol: TCP
  public:
    enabled: true
    controller: main
    primary: false
    type: LoadBalancer
    externalTrafficPolicy: Cluster
    annotations:
      lbipam.cilium.io/ips: "172.31.0.36"
    ports:
      http:
        enabled: true
        port: *port
        targetPort: http
        protocol: TCP

persistence:
  cache:
    enabled: true
    type: persistentVolumeClaim
    storageClass: ceph-block-retain
    accessMode: ReadWriteOnce
    size: 100Gi
    retain: true
    advancedMounts:
      main:
        core:
          - path: /cache/huggingface
            readOnly: false
  shm:
    enabled: true
    type: emptyDir
    medium: Memory
    sizeLimit: 2Gi
    advancedMounts:
      main:
        core:
          - path: /dev/shm
            readOnly: false
