# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
---
# NVIDIA RTX 5090 with vLLM, Qwen3.8-27B-NVFP4 model.
# 32GB VRAM is sufficient for NVFP4 weights (~14GB) plus KV cache.
defaultPodOptions:
  automountServiceAccountToken: false
  enableServiceLinks: false
  restartPolicy: Always
  dnsPolicy: ClusterFirst
  runtimeClassName: nvidia
  securityContext:
    fsGroup: 1000
    fsGroupChangePolicy: OnRootMismatch

controllers:
  main:
    enabled: true
    type: deployment
    replicas: 1
    revisionHistoryLimit: 2
    containers:
      core:
        ports:
          - name: http
            containerPort: &port 8080
            protocol: TCP
        image:
          repository: vllm/vllm-openai
          tag: v0.29.0-x86_64-cu129
          digest: sha256:3e10e8189823e0f7ae4620c271bcdaaf64127ec7d0edc351591a508498b7684a
          pullPolicy: Always
        args:
          - --model
          - nvidia/Qwen3.8-27B-NVFP4
          - --gpu-memory-utilization
          - "0.9325"
          - --max-num-batched-tokens
          - "8192"
          - --max-model-len
          - "131072"
          - --kv-cache-dtype
          - fp8
          - --served-model-name
          - nvidia-qwen3-32b-nvfp4
          - --enable-chunked-prefill
          # CUDA-graph capture/profiling allocates a KV cache buffer sized to
          # min(max_num_seqs, max_cudagraph_capture_size) *before* the real KV
          # cache is sized. The default cap (512 on this non-datacenter
          # Blackwell GPU) needs ~12GB for that buffer alone, which OOMs on a
          # 32GB card once model weights + CUDA/compile overhead (~22GB) are
          # accounted for. Capping it here keeps full CUDA graphs (and thus
          # --max-num-batched-tokens/--max-model-len unchanged) while shrinking
          # the profiling buffer to a size that actually fits. 128 still covers
          # realistic decode concurrency for a single-GPU homelab deployment;
          # larger batches simply fall back to the piecewise/eager path.
          - --max-cudagraph-capture-size
          - "128"
          # nvidia/Qwen3.8-27B-NVFP4 is a hybrid Mamba/attention model: each
          # concurrent decode sequence needs one dedicated Mamba SSM-state
          # cache block (separate from the paged attention KV cache), and
          # only a limited number of those blocks fit in the memory budget.
          # The default max_num_seqs (256) exceeds that pool, so CUDA graph
          # capture refuses to start. Capping it here (comfortably below the
          # observed ~121-block ceiling) is what the engine itself
          # recommends; raise --gpu-memory-utilization instead if more
          # concurrent decode slots are needed.
          - --max-num-seqs
          - "96"
        env:
          - name: VLLM_HOST_IP
            value: "0.0.0.0"
          - name: VLLM_PORT
            value: "8080"
          - name: HF_HOME
            value: /cache/huggingface
          # hf-xet (bundled with huggingface_hub) already gives fast, chunked
          # concurrent downloads by default; this just raises its concurrency
          # ceiling. HF_TOKEN avoids anonymous-request rate limiting (and is
          # required for gated models), same as intel-vllm.
          - name: HF_XET_HIGH_PERFORMANCE
            value: "1"
          - name: HF_TOKEN
            valueFrom:
              secretKeyRef:
                name: hf-secret
                key: token
        securityContext:
          allowPrivilegeEscalation: false
        probes:
          startup:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /health
                port: http
              initialDelaySeconds: 60
              periodSeconds: 30
              failureThreshold: 60
          readiness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /health
                port: http
              initialDelaySeconds: 10
              periodSeconds: 15
          liveness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /health
                port: http
              initialDelaySeconds: 30
              periodSeconds: 30
        resources:
          limits:
            nvidia.com/gpu: "1"
            memory: 64Gi
          requests:
            nvidia.com/gpu: "1"
            memory: 48Gi
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File

service:
  core:
    enabled: true
    controller: main
    primary: true
    type: ClusterIP
    ports:
      http:
        enabled: true
        port: *port
        targetPort: http
        protocol: TCP
  public:
    enabled: true
    controller: main
    primary: false
    type: LoadBalancer
    externalTrafficPolicy: Cluster
    annotations:
      lbipam.cilium.io/ips: "172.31.0.36"
    ports:
      http:
        enabled: true
        port: *port
        targetPort: http
        protocol: TCP

persistence:
  cache:
    enabled: true
    type: persistentVolumeClaim
    storageClass: ceph-block-retain
    accessMode: ReadWriteOnce
    size: 100Gi
    retain: true
    advancedMounts:
      main:
        core:
          - path: /cache/huggingface
            readOnly: false
  shm:
    enabled: true
    type: emptyDir
    medium: Memory
    sizeLimit: 2Gi
    advancedMounts:
      main:
        core:
          - path: /dev/shm
            readOnly: false
