# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
---
defaultPodOptions:
  automountServiceAccountToken: false
  enableServiceLinks: false
  restartPolicy: Always
  dnsPolicy: ClusterFirst
  runtimeClassName: nvidia
  securityContext:
    fsGroup: 1000
    fsGroupChangePolicy: OnRootMismatch

controllers:
  main:
    enabled: true
    type: deployment
    replicas: 1
    revisionHistoryLimit: 2
    containers:
      core:
        ports:
          - name: http
            containerPort: &port 8080
            protocol: TCP
        image:
          repository: ghcr.io/ggml-org/llama.cpp
          tag: server-cuda12
          pullPolicy: Always
        args:
          # Model
          - --hf-repo
          - unsloth/Qwen3.8-27B-GGUF
          - --hf-file
          - Qwen3.8-27B-UD-Q5_K_M.gguf

          # Vision
          - --mmproj-auto
          - --mmproj-offload
          - --image-min-tokens
          - "256"
          - --image-max-tokens
          - "4096"
          - --mtmd-batch-max-tokens
          - "1024"

          # GPU
          - --gpu-layers
          - all
          - --flash-attn
          - "on"

          - --parallel
          - "4"
          - --ctx-size
          - "131072"
          - --kv-unified
          - --cont-batching

          # Quantized KV cache
          - --cache-type-k
          - q8_0
          - --cache-type-v
          - q8_0

          # Prompt processing
          - --batch-size
          - "2048"
          - --ubatch-size
          - "512"

          # Prompt reuse
          - --cache-prompt
          - --cache-ram
          - "4096"
          - --cache-reuse
          - "256"
          - --ctx-checkpoints
          - "4"
          - --checkpoint-min-step
          - "8192"
          - --slot-prompt-similarity
          - "0.25"

          # CPU support
          - --threads
          - "8"
          - --threads-batch
          - "8"
          - --threads-http
          - "8"

          # Chat template and reasoning
          - --jinja
          - --reasoning
          - "on"
          - --reasoning-budget
          - "8192"

          # Thinking-mode sampling
          - --temperature
          - "1.0"
          - --top-k
          - "20"
          - --top-p
          - "0.95"
          - --min-p
          - "0.0"
          - --presence-penalty
          - "0.0"
          - --repeat-penalty
          - "1.0"
          # Runtime
          - --load-mode
          - mmap
          - --metrics
        env:
          - name: LLAMA_ARG_HOST
            value: "0.0.0.0"
          - name: LLAMA_ARG_PORT
            value: "8080"
          - name: "LLAMA_ARG_UI"
            value: "off"
          - name: LD_LIBRARY_PATH
            value: /app
          - name: LLAMA_API_KEY
            valueFrom:
              secretKeyRef:
                name: nvidia-llm-api-key
                key: api-key
          - name: HF_HOME
            value: /cache/huggingface
        securityContext:
          allowPrivilegeEscalation: false
        probes:
          startup:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /health
                port: http
              initialDelaySeconds: 60
              periodSeconds: 30
              failureThreshold: 40
          readiness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /health
                port: http
              initialDelaySeconds: 10
              periodSeconds: 15
          liveness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /health
                port: http
              initialDelaySeconds: 30
              periodSeconds: 30
        resources:
          limits:
            nvidia.com/gpu: "1"
            memory: 48Gi
          requests:
            nvidia.com/gpu: "1"
            memory: 48Gi
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File

service:
  core:
    enabled: true
    controller: main
    primary: true
    type: ClusterIP
    ports:
      http:
        enabled: true
        port: *port
        targetPort: http
        protocol: TCP
  public:
    enabled: true
    controller: main
    primary: false
    type: LoadBalancer
    externalTrafficPolicy: Cluster
    annotations:
      lbipam.cilium.io/ips: "172.31.0.36"
    ports:
      http:
        enabled: true
        port: *port
        targetPort: http
        protocol: TCP

persistence:
  cache:
    enabled: true
    type: persistentVolumeClaim
    storageClass: ceph-block-retain
    accessMode: ReadWriteOnce
    size: 100Gi
    retain: true
    advancedMounts:
      main:
        core:
          - path: /cache/huggingface
            readOnly: false
  shm:
    enabled: true
    type: emptyDir
    medium: Memory
    sizeLimit: 16Gi
    advancedMounts:
      main:
        core:
          - path: /dev/shm
            readOnly: false
