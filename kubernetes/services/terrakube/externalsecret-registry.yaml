---
# Credentials for the Terrakube private module/provider registry.
# OpenBao source: secret/dan/terrakube/registry (keeper.goodmanners.services)
#
# NOTE: PatSecret and InternalSecret must be stored as the base64 encoding of
# the actual random value (same convention as terrakube-api). See README.md.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: terrakube-registry
spec:
  secretStoreRef:
    name: openbao-labops
    kind: ClusterSecretStore
  target:
    name: terrakube-registry-secrets
    creationPolicy: Owner
  refreshInterval: 1h
  data:
    - secretKey: PatSecret
      remoteRef:
        key: dan/terrakube/registry
        property: PatSecret
    - secretKey: InternalSecret
      remoteRef:
        key: dan/terrakube/registry
        property: InternalSecret
    - secretKey: AppClientId
      remoteRef:
        key: dan/terrakube/registry
        property: AppClientId
    - secretKey: AwsStorageAccessKey
      remoteRef:
        key: dan/terrakube/registry
        property: AwsStorageAccessKey
    - secretKey: AwsStorageSecretKey
      remoteRef:
        key: dan/terrakube/registry
        property: AwsStorageSecretKey
