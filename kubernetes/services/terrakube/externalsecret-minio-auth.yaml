---
# MinIO root credentials for the bundled MinIO subchart (terraform state +
# job outputs storage). OpenBao source: secret/dan/terrakube/minio
# (keeper.goodmanners.services). The same values are also referenced by the
# terrakube-api/executor/registry ExternalSecrets.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: terrakube-minio-auth
spec:
  secretStoreRef:
    name: openbao-labops
    kind: ClusterSecretStore
  target:
    name: terrakube-minio-auth
    creationPolicy: Owner
  refreshInterval: 1h
  data:
    - secretKey: rootUser
      remoteRef:
        key: dan/terrakube/minio
        property: rootUser
    - secretKey: rootPassword
      remoteRef:
        key: dan/terrakube/minio
        property: rootPassword
