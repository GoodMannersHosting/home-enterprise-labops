---
# Signing/identity credentials for the Terrakube API.
# OpenBao source: secret/dan/terrakube/api (keeper.goodmanners.services)
#
# NOTE: PatSecret and InternalSecret must be stored as the base64 encoding of
# the actual random value (the chart b64encs them when it generates this
# secret and the API b64-decodes them at runtime). See README.md.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: terrakube-api
spec:
  secretStoreRef:
    name: openbao-labops
    kind: ClusterSecretStore
  target:
    name: terrakube-api-secrets
    creationPolicy: Owner
  refreshInterval: 1h
  data:
    - secretKey: PatSecret
      remoteRef:
        key: dan/terrakube/api
        property: PatSecret
    - secretKey: InternalSecret
      remoteRef:
        key: dan/terrakube/api
        property: InternalSecret
    - secretKey: DexClientId
      remoteRef:
        key: dan/terrakube/api
        property: DexClientId
    - secretKey: TerrakubeRedisPassword
      remoteRef:
        key: dan/terrakube/api
        property: TerrakubeRedisPassword
    - secretKey: DatasourcePassword
      remoteRef:
        key: dan/terrakube/api
        property: DatasourcePassword
    - secretKey: AwsStorageAccessKey
      remoteRef:
        key: dan/terrakube/api
        property: AwsStorageAccessKey
    - secretKey: AwsStorageSecretKey
      remoteRef:
        key: dan/terrakube/api
        property: AwsStorageSecretKey
