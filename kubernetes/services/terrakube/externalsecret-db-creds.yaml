---
# PostgreSQL credentials for the Terrakube database on the shared cluster
# instance (db-rw.database.svc). OpenBao source: secret/dan/terrakube/postgres
# (keeper.goodmanners.services). The role/database are created by
# db-init-job.yaml; the same password is reused as DatasourcePassword in
# secret/dan/terrakube/api.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: terrakube-db
spec:
  secretStoreRef:
    name: openbao-labops
    kind: ClusterSecretStore
  target:
    name: terrakube-db-creds
    creationPolicy: Owner
  refreshInterval: 1h
  data:
    - secretKey: POSTGRES_HOST
      remoteRef:
        key: dan/terrakube/postgres
        property: POSTGRES_HOST
    - secretKey: POSTGRES_USER
      remoteRef:
        key: dan/terrakube/postgres
        property: POSTGRES_USER
    - secretKey: POSTGRES_PASS
      remoteRef:
        key: dan/terrakube/postgres
        property: POSTGRES_PASS
