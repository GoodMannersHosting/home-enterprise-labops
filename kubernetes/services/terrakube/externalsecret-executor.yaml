---
# Credentials for the Terrakube executor (runs the terraform/tofu jobs).
# OpenBao source: secret/dan/terrakube/executor (keeper.goodmanners.services)
#
# NOTE: InternalSecret must be stored as the base64 encoding of the actual
# random value (same convention as terrakube-api). See README.md.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: terrakube-executor
spec:
  secretStoreRef:
    name: openbao-labops
    kind: ClusterSecretStore
  target:
    name: terrakube-executor-secrets
    creationPolicy: Owner
  refreshInterval: 1h
  data:
    - secretKey: InternalSecret
      remoteRef:
        key: dan/terrakube/executor
        property: InternalSecret
    - secretKey: TerrakubeRedisPassword
      remoteRef:
        key: dan/terrakube/executor
        property: TerrakubeRedisPassword
    - secretKey: AwsTerraformStateAccessKey
      remoteRef:
        key: dan/terrakube/executor
        property: AwsTerraformStateAccessKey
    - secretKey: AwsTerraformStateSecretKey
      remoteRef:
        key: dan/terrakube/executor
        property: AwsTerraformStateSecretKey
    - secretKey: AwsTerraformOutputAccessKey
      remoteRef:
        key: dan/terrakube/executor
        property: AwsTerraformOutputAccessKey
    - secretKey: AwsTerraformOutputSecretKey
      remoteRef:
        key: dan/terrakube/executor
        property: AwsTerraformOutputSecretKey
