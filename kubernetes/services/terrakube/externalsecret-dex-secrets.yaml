---
# DEX connector credentials: the Authentik OAuth client id/secret used by the
# DEX OIDC connector. OpenBao source: secret/dan/terrakube/dex
# (keeper.goodmanners.services).
#
# The values are injected into the DEX pod as env vars (see values.yaml) and
# referenced from the connector config via DEX's built-in env expansion
# ($DEX_CLIENT_ID / $DEX_CLIENT_SECRET), so the secret never appears in git.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: terrakube-dex
spec:
  secretStoreRef:
    name: openbao-labops
    kind: ClusterSecretStore
  target:
    name: terrakube-dex-secrets
    creationPolicy: Owner
  refreshInterval: 1h
  data:
    - secretKey: client-id
      remoteRef:
        key: dan/terrakube/dex
        property: client-id
    - secretKey: client-secret
      remoteRef:
        key: dan/terrakube/dex
        property: client-secret
