namespace: gaming
resources:
- secret.9a-windrose.yaml

components:
  - ../../core/kopiur/backup-component

patches:
  - target:
      kind: SnapshotPolicy
      name: backup-target-pvc
    patch: |
      - op: replace
        path: /metadata/name
        value: windrose-9a-data
      - op: replace
        path: /spec/sources/0/pvc/name
        value: windrose-9a
  - target:
      kind: SnapshotSchedule
      name: backup-target-schedule
    patch: |
      - op: replace
        path: /metadata/name
        value: windrose-9a-data-nightly
      - op: replace
        path: /spec/policyRef/name
        value: windrose-9a-data
