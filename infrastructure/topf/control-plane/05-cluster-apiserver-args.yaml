apiVersion: v1alpha1
kind: KubeAuthenticationConfig
configuration:
  anonymous:
    enabled: true
    conditions:
      - path: /livez
      - path: /readyz
      - path: /healthz
  jwt:
    - issuer:
        url: https://auth.goodmanners.services/application/o/kubernetes-helo/
        audiences:
          - helo-k8s
      claimMappings:
        username:
          claim: preferred_username
          prefix: "oidc:/"
        groups:
          claim: groups
          prefix: "oidc:/"
